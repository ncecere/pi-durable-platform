          type: integer
          format: int64
          description: Open owner invites (an owner invited by email who hasn't signed in yet)
        personalOwner:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/MemberUser'
          description: A personal workspace's person
    TeamUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TeamStatus'
    TeamView:
      type: object
      required:
      - team
      properties:
        team:
          $ref: '#/components/schemas/Team'
        role:
          description: The caller's role; absent when viewing as a platform admin or auditor
          allOf:
          - $ref: '#/components/schemas/TeamRole'
    User:
      type: object
      required:
      - id
      - email
      - displayName
      - platformRole
      - status
      - revision
      - createdAt
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        platformRole:
          $ref: '#/components/schemas/PlatformRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        accessDeniedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the identity provider's group rule (OIDC_ALLOWED_GROUPS, re-checked while people are signed in) ended
            this person's access: sessions and connected apps were revoked and they count as inactive (like a
            suspended person) until they sign in again. Separate from `status`, which only admins change.
        accessDeniedReason:
          type: string
          nullable: true
          enum: [not_in_group, idp_refused, idp_unreachable]
          description: >-
            not_in_group: the provider's fresh claims lack an allowed group. idp_refused: it rejected the stored grant
            (person disabled, grant revoked or expired). idp_unreachable: it could not vouch for the person within the
            grace period (OIDC_GROUP_RECHECK_GRACE).
        teamCount:
          type: integer
          format: int64
          description: Teams the user belongs to (admin user list only)
    UserDetail:
      type: object
      required:
