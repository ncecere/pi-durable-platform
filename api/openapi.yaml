          description: Its home page (https)
        logoUrl:
          type: string
          description: >-
            The logo it published (https; present when it published one). Don't load it from the browser: show it with
            GET /v1/oauth/client-logo?client_id=<id>, which the platform serves from its own origin.
        trusted:
          type: boolean
          description: On the platform's trusted list (skips the consent screen)
