  /v1/hooks/{hookId}:
    parameters:
    - name: hookId
      in: path
      required: true
      description: The webhook's address (h_ and 128 random bits)
      schema:
        type: string
    post:
      tags:
      - triggers
      operationId: deliverWebhook
      summary: Deliver to a webhook trigger (no session or key - the signature is the credential)
      description: >-
        Sign the raw body - `X-PDP-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256(secret, "<t>." + body)>`. A missing,
        malformed or wrong signature, or one more than 5 minutes from the platform's clock, is 401 invalid_signature.
        The body (at most 256 KiB, JSON or text) fills the trigger's template; a JSON body that doesn't meet the
        trigger's filter is answered `matched: false` and starts nothing. A replay of a delivery is answered with the
        first delivery's run (`replayed: true`). Each address takes at most 120 verified deliveries a minute, and at most
        240 requests a minute from one client address, verified or not (429).
      parameters:
      - name: X-PDP-Signature
        in: header
        required: true
        schema:
          type: string
          maxLength: 1024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          text/plain:
            schema:
              type: string
      responses:
        '202':
          description: Accepted (a run, maybe skipped by a limit, or nothing when the filter didn't match)
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookAccepted'
              example:
                data:
                  matched: true
                  replayed: false
                  runId: 5b0e7c1e-3f4a-4c55-9a8e-0b6f3c2d1e0f
                  status: pending
        '401':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '413':
          $ref: '#/components/responses/ErrorReply'
        '429':
          $ref: '#/components/responses/ErrorReply'
components:
  headers:
    ETag:
      description: Quoted revision, for If-Match on the next update
      schema:
        type: string
    IdempotentReplayed:
      description: '"true" when the answer is an earlier request''s with the same Idempotency-Key'
      schema:
        type: string
        enum: ['true']
  parameters:
    TriggerIdParam:
      name: triggerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunStatusParam:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TriggerRunStatus'
    McpServerIdParam:
      name: serverId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderIdParam:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelIdParam:
      name: modelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateIdParam:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentIdParam:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApprovalIdParam:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        pattern: '^ap_[A-Za-z0-9_-]{1,64}$'
    ThreadIdParam:
      name: threadId
      in: path
      required: true
      description: >-
        Thread ID (1-64 letters, digits, dashes or underscores): the platform's, from createAgentThread, or one the client
        chooses (use a random one: whoever uses an ID first starts that thread)
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'
    DocumentKindParam:
      name: kind
      in: path
      required: true
      description: An exposed document's kind (as the agent's author defined it, e.g. acme.board)
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    AuditActionParam:
      name: action
      in: query
      required: false
      description: An exact action (team.member_add), or a prefix ending in a dot (team.) for every action in that group.
      schema:
        type: string
        maxLength: 100
        pattern: ^[a-z][a-z_]*\.[a-z_]*$
        example: team.
    AuditActorKindParam:
      name: actorKind
      in: query
      required: false
      description: Only entries by the system
      schema:
        type: string
        enum:
        - system
    AuditActorParam:
      name: actorUserId
      in: query
      required: false
      description: Only entries by this person (including their API keys)
      schema:
        type: string
        format: uuid
    AuditExcludeActionParam:
      name: excludeAction
      in: query
      required: false
      description: 'Action groups (prefixes ending in a dot, comma-separated) to leave out: auth. hides sign-ins and sign-outs.'
      schema:
        type: string
        maxLength: 100
        pattern: ^[a-z][a-z_]*\.(,[a-z][a-z_]*\.)*$
        example: auth.
    AuditFromParam:
      name: from
      in: query
      required: false
      description: Entries at or after this time
      schema:
        type: string
        format: date-time
    AuditTargetTypeParam:
      name: targetType
      in: query
      required: false
      schema:
        type: string
        maxLength: 64
        pattern: ^[a-z_]+$
        example: team
    AuditToParam:
      name: to
      in: query
      required: false
      description: Entries before this time (exclusive)
      schema:
        type: string
        format: date-time
    CursorParam:
      name: cursor
      in: query
      required: false
      description: nextCursor from the previous page
      schema:
        type: string
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        A key the client chooses for one request (a UUID, for example), so a retry doesn't repeat it
        (draft-ietf-httpapi-idempotency-key-header). 1-255 printable ASCII characters, optionally quoted as a
        structured-field string. Invalid: 400 invalid_idempotency_key.
      schema:
        type: string
        maxLength: 257
    IfMatchHeader:
      name: If-Match
      in: header
      required: true
      description: The resource's revision, as returned in ETag (for example "3"). Missing returns 428; stale returns 412.
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    SearchParam:
      name: q
      in: query
      required: false
      description: Case-insensitive substring match. Valid UTF-8 without NUL characters (else 400 invalid_query).
      schema:
        type: string
        maxLength: 200
    TeamParam:
      name: team
      in: path
      required: true
      description: Team slug or ID
      schema:
        type: string
    GrantIdParam:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceAccountIdParam:
      name: serviceAccountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    RunPageReply:
      description: Runs, newest first, and nextCursor when more follow
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/TriggerRun'
              nextCursor:
                type: string
                description: Pass it back as cursor for the next page
    AuditPageReply:
      description: A page of audit entries, newest first
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/AuditPage'
    ErrorReply:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    HealthReply:
      description: Health status
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/Health'
    OkReply:
      description: Success
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/Ok'
  schemas:
    TriggerKind:
      type: string
      enum: [schedule, webhook]
    TriggerFilter:
      type: object
      required: [path, equals]
      description: >-
        A webhook's condition - the payload's field at `path` (names or array indexes joined by dots, at most 10) equals
        `equals` (a string field as is, other values by their JSON text such as 42, true or null)
      properties:
        path:
          type: string
          maxLength: 200
        equals:
          type: string
          maxLength: 1000
    TriggerSchedule:
      type: object
      required: [cron, timezone, missedPolicy]
      properties:
        cron:
          type: string
          description: Five fields (minute hour day month weekday) or @hourly, @daily, @weekly, @monthly, @yearly
        timezone:
          type: string
          description: IANA time zone
        missedPolicy:
          type: string
          enum: [skip, run_once]
          description: A fire missed while the platform wasn't running - skip it, or run once for the latest one
        nextFireAt:
          type: string
          format: date-time
          nullable: true
    Trigger:
      type: object
      required: [id, agentId, kind, name, source, once, originThreadId, paused, threadId, messageTemplate, consecutiveFailures, createdAt, updatedAt, revision]
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/TriggerKind'
        name:
          type: string
        source:
          type: string
          enum: [person, agent]
          description: >-
            Who made it - a person, or the agent itself (its schedule tool, when its template version lets it). An
            agent-made trigger can be paused, resumed, run now or deleted; nothing else about it changes.
        once:
          type: boolean
          description: A one-time reminder (agent-made), removed when it fires
        originThreadId:
          type: string
          nullable: true
          description: The thread the agent made it in (agent-made triggers)
        paused:
          type: boolean
        pausedReason:
          type: string
          nullable: true
          enum: [user, failures]
          description: Paused by a person, or by the platform after failed runs in a row
        threadId:
          type: string
          nullable: true
          description: The thread every fire sends to (null - a new thread at every fire)
        messageTemplate:
          type: string
          nullable: true
          description: >-
            The message, with placeholders {{payload}}, {{payload.<path>}} (webhooks), {{trigger.name}},
            {{trigger.kind}}, {{fire.id}} and {{fire.time}}. Null when withheld (messageHidden): an agent-made
            trigger's message is conversation-derived text, so platform staff never see it, and people who may
            use the agent see it only when they may read the thread it was made in.
        messageHidden:
          type: boolean
          description: The message is withheld from the caller (messageTemplate is null)
        schedule:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/TriggerSchedule'
        webhookUrl:
          type: string
          nullable: true
          description: Where a webhook's sender POSTs (webhooks)
        webhookSecretPrefix:
          type: string
          nullable: true
          description: The webhook secret's first characters, to tell it apart
        filter:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/TriggerFilter'
        callbackUrl:
          type: string
          nullable: true
        callbackSecretPrefix:
          type: string
          nullable: true
        dailyBudgetUsd:
          type: number
          format: double
          nullable: true
          description: The most this trigger's runs may cost per UTC day
        consecutiveFailures:
          type: integer
          format: int32
        backoffUntil:
          type: string
          format: date-time
          nullable: true
        lastFiredAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        revision:
          $ref: '#/components/schemas/Revision'
    TriggerCreate:
      type: object
      required: [kind, name, messageTemplate]
      properties:
        kind:
          $ref: '#/components/schemas/TriggerKind'
        name:
          type: string
          maxLength: 100
        paused:
          type: boolean
        threadId:
          type: string
          maxLength: 64
          description: A thread for every fire (shared, or not used yet); omitted or "" - a new thread at every fire
        messageTemplate:
          type: string
          maxLength: 8000
        cron:
          type: string
          maxLength: 200
          description: Schedules (required)
        timezone:
          type: string
          maxLength: 64
          description: Schedules (default UTC)
        missedPolicy:
          type: string
          enum: [skip, run_once]
          description: Schedules (default skip)
        filter:
          $ref: '#/components/schemas/TriggerFilter'
        callbackUrl:
          type: string
          maxLength: 2000
          description: An https URL called, signed, when each run ends
        dailyBudgetUsd:
          type: number
          format: double
    TriggerUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        paused:
          type: boolean
        threadId:
          type: string
          maxLength: 64
        messageTemplate:
          type: string
          maxLength: 8000
        cron:
          type: string
          maxLength: 200
        timezone:
          type: string
          maxLength: 64
        missedPolicy:
          type: string
          enum: [skip, run_once]
        filter:
          $ref: '#/components/schemas/TriggerFilter'
        callbackUrl:
          type: string
          maxLength: 2000
        dailyBudgetUsd:
          type: number
          format: double
    TriggerSaved:
      type: object
      required: [trigger]
      properties:
        trigger:
          $ref: '#/components/schemas/Trigger'
        webhookSecret:
          type: string
          description: The webhook secret (pdpwh_…), when this request made one - shown once
        callbackSecret:
          type: string
          description: The callback secret (pdpcb_…), when this request made one - shown once
    TriggerSecretRotate:
      type: object
      required: [which]
      properties:
        which:
          type: string
          enum: [webhook, callback]
    TriggerSettings:
      type: object
      required: [paused, effectiveConcurrentRuns, effectiveRunSeconds, ceilingConcurrentRuns, ceilingRunSeconds, revision]
      properties:
        paused:
          type: boolean
          description: Every trigger of the agent is paused
        maxConcurrentRuns:
          type: integer
          format: int32
          nullable: true
          description: Runs at once (pending and running); null - the default, 1
        maxRunSeconds:
          type: integer
          format: int32
          nullable: true
          description: Null - the platform's ceiling
        dailyBudgetUsd:
          type: number
          format: double
          nullable: true
          description: The most the agent's triggered runs may cost per UTC day
        effectiveConcurrentRuns:
          type: integer
          format: int32
        effectiveRunSeconds:
          type: integer
          format: int32
        ceilingConcurrentRuns:
          type: integer
          format: int32
        ceilingRunSeconds:
          type: integer
          format: int32
        revision:
          $ref: '#/components/schemas/Revision'
        updatedAt:
          type: string
          format: date-time
          nullable: true
    TriggerSettingsUpdate:
      type: object
      required: [paused]
      properties:
        paused:
          type: boolean
        maxConcurrentRuns:
          type: integer
          format: int32
          nullable: true
          minimum: 1
        maxRunSeconds:
          type: integer
          format: int32
          nullable: true
          minimum: 60
        dailyBudgetUsd:
          type: number
          format: double
          nullable: true
          minimum: 0
    TriggerRunStatus:
      type: string
      enum: [pending, running, succeeded, failed, stopped, skipped]
    TriggerRun:
      type: object
      required: [id, agentId, triggerId, triggerName, triggerKind, firedBy, fireId, threadId, status, reason, createdAt, costUsd, requests]
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        triggerId:
          type: string
          format: uuid
          nullable: true
          description: Null once the trigger was deleted (its name stays)
        triggerName:
          type: string
        triggerKind:
          $ref: '#/components/schemas/TriggerKind'
        firedBy:
          type: string
          enum: [schedule, webhook, manual]
        fireId:
          type: string
          description: The fire's ID, also the message's pi-durable requestId
        threadId:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/TriggerRunStatus'
        reason:
          type: string
          nullable: true
          description: >-
            Why it was skipped (trigger_paused, agent_paused, team_archived, concurrency, budget, backoff, missed,
            agent_daily_runs),
            stopped (max_run_time, budget) or failed (reply_error, delivery_failed, agent_disabled, thread_private, …)
        scheduledFor:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        costUsd:
          type: number
          format: double
          description: The agent's model usage while the run was in progress, at current prices (an upper bound when it did other work meanwhile)
        requests:
          type: integer
          format: int64
        callbackStatus:
          type: string
          nullable: true
          enum: [pending, delivered, failed]
        link:
          type: string
          nullable: true
          description: The console's path of the run's thread
    WebhookAccepted:
      type: object
      required: [matched, replayed]
      properties:
        matched:
          type: boolean
          description: False - the filter didn't match; nothing started
        replayed:
          type: boolean
          description: True - a replay of an earlier delivery, answered with its run
        runId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TriggerRunStatus'
        reason:
          type: string
          nullable: true
    PersonalWorkspaceSettings:
      type: object
      required: [enabled, maxAgents, maxRunning, revision, updatedAt]
      properties:
        enabled:
          type: boolean
          description: People get a personal workspace when they sign in
        ownProviders:
          type: boolean
          x-omitempty: false
          description: Personal workspaces may add their own model providers (while teams may)
        ownMcpServers:
          type: boolean
          x-omitempty: false
          description: Personal workspaces may add their own MCP servers (while teams may)
        maxAgents:
          type: integer
          format: int32
        maxRunning:
          type: integer
          format: int32
          description: Agents running at once
        monthlyBudgetUsd:
          type: number
          format: double
          nullable: true
          description: Recorded; not enforced yet
        revision:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    PersonalWorkspaceSettingsUpdate:
      type: object
      required: [enabled, maxAgents, maxRunning]
      properties:
        enabled:
          type: boolean
        ownProviders:
          type: boolean
          description: Omitted keeps the current setting
        ownMcpServers:
          type: boolean
          description: Omitted keeps the current setting
        maxAgents:
          type: integer
          format: int32
        maxRunning:
          type: integer
          format: int32
        monthlyBudgetUsd:
          type: number
          format: double
          nullable: true
    WorkspaceLimits:
      type: object
      required: [kind, agentCount, runningCount, overridden]
      properties:
        kind:
          type: string
          enum: [team, personal]
        maxAgents:
          type: integer
          format: int32
          nullable: true
        maxRunning:
          type: integer
          format: int32
          nullable: true
        monthlyBudgetUsd:
          type: number
          format: double
          nullable: true
        overridden:
          type: array
          items:
            type: string
          description: Which limits are this workspace's own (the others are the platform's defaults)
        agentCount:
          type: integer
          format: int64
        runningCount:
          type: integer
          format: int64
        canAddProviders:
          type: boolean
          x-omitempty: false
          description: >-
            Whether the caller may add a model provider for this workspace now (an owner or admin in a browser
            session, while platform admins let teams, and personal workspaces, add them)
        canAddMcpServers:
          type: boolean
          x-omitempty: false
          description: >-
            Whether the caller may add an MCP server for this workspace now (an owner or admin in a browser session,
            while platform admins let teams, and personal workspaces, add them)
    WorkspaceLimitsUpdate:
      type: object
      properties:
        maxAgents:
          type: integer
          format: int32
          nullable: true
        maxRunning:
          type: integer
          format: int32
          nullable: true
        monthlyBudgetUsd:
          type: number
          format: double
          nullable: true
    McpTool:
      type: object
      required: [name]
      properties:
        name:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
    McpServer:
      type: object
      required: [id, name, slug, description, url, accessMode, enabled, visibility, personal, hasHeaders, tools, sendIdentity, identityAudience, identityEmail, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          description: Names its tools for the model (mcp__<slug>__<tool>); unique across the platform and every team
        description:
          type: string
        url:
          type: string
        accessMode:
          type: string
          enum: [proxy, direct]
          description: 'proxy: agents call the platform, which adds the headers, allows only their tools and logs calls; direct: agents get the URL and headers'
        enabled:
          type: boolean
        visibility:
          type: string
          enum: [all, teams]
        personal:
          type: boolean
          description: Available in personal workspaces (when created, defaults to visibility = all)
        teams:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ModelTeam'
        hasHeaders:
          type: boolean
        tools:
          type: array
          items:
            $ref: '#/components/schemas/McpTool'
        sendIdentity:
          type: boolean
          description: >-
            In proxy mode, every request the platform forwards carries a signed identity token (MCP-Gateway-Identity:
            the agent, its team, the thread's visibility and, when the platform's records say so, the person the call
            is for). Direct mode never does. See docs/mcp-identity.md
        identityAudience:
          type: string
          nullable: true
          x-omitempty: false
          description: The identity token's audience (aud); null when it is the server's URL
        identityEmail:
          type: boolean
          description: The identity token includes the person's email
        toolsRefreshedAt:
          type: string
          format: date-time
          nullable: true
        toolsError:
          type: string
          nullable: true
          description: Why the tools could not be read the last time
        team:
          allOf:
          - $ref: '#/components/schemas/ModelOwner'
          nullable: true
          x-omitempty: false
          description: The team that owns the server (null for a platform server); a team's server is for that team only
        revision:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    McpServerCreate:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          pattern: '^[a-z0-9](?:[a-z0-9_]{0,30}[a-z0-9])?$'
          description: Default from the name; cannot change later
        description:
          type: string
          maxLength: 2000
        url:
          type: string
          maxLength: 2048
          description: The server's Streamable HTTP endpoint
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
        accessMode:
          type: string
          enum: [proxy, direct]
        visibility:
          type: string
          enum: [all, teams]
        personal:
          type: boolean
          description: Available in personal workspaces (when created, defaults to visibility = all)
        teams:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        sendIdentity:
          type: boolean
          description: Send the signed identity token in proxy mode (default on). See docs/mcp-identity.md
        identityAudience:
          type: string
          maxLength: 2048
          description: The identity token's audience; empty for the server's URL (the default)
        identityEmail:
          type: boolean
          description: Include the person's email in the identity token (default off)
    McpServerUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        url:
          type: string
          maxLength: 2048
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
          description: Replaces every header ({} removes them)
        accessMode:
          type: string
          enum: [proxy, direct]
        visibility:
          type: string
          enum: [all, teams]
        personal:
          type: boolean
          description: Available in personal workspaces (when created, defaults to visibility = all)
        teams:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        sendIdentity:
          type: boolean
          description: Send the signed identity token in proxy mode (default on). See docs/mcp-identity.md
        identityAudience:
          type: string
          maxLength: 2048
          description: The identity token's audience; empty for the server's URL (the default)
        identityEmail:
          type: boolean
          description: Include the person's email in the identity token (default off)
    McpAttach:
      type: object
      required: [serverId]
      properties:
        serverId:
          type: string
          format: uuid
        tools:
          type: array
          nullable: true
          items:
            type: string
          description: Only these of its tools (absent - all)
    McpAttached:
      type: object
      required: [serverId, name, slug]
      properties:
        serverId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        tools:
          type: array
          nullable: true
          items:
            type: string
    ClientMcpServer:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
          maxLength: 100
          description: Shown to the model; names the server's tools (mcpc__<slug>__<tool>)
        url:
          type: string
          maxLength: 2048
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
          description: For example the user's Authorization header
        expiresInSeconds:
          type: integer
          format: int32
          description: Default a day, at most a week
    ThreadMcpServer:
      type: object
      required: [name, slug, url, expiresAt]
      properties:
        name:
          type: string
        slug:
          type: string
        url:
          type: string
        expiresAt:
          type: string
          format: date-time
    UsageRow:
      type: object
      required: [requests, inputTokens, outputTokens, cacheReadTokens, cacheWriteTokens, costUsd, unpricedRequests, managed]
      properties:
        day:
          type: string
          format: date
          nullable: true
        modelId:
          type: string
          format: uuid
          nullable: true
          description: Absent when grouped by model - the platform's default model
        modelName:
          type: string
          nullable: true
        providerName:
          type: string
          nullable: true
        agentId:
          type: string
          format: uuid
          nullable: true
          description: Absent when grouped by agent (or agent and day) - a deleted agent, or service-managed agents summed
        agentName:
          type: string
          nullable: true
        managed:
          type: boolean
          description: Service-managed agents (one per app user)
        teamId:
          type: string
          format: uuid
          nullable: true
        teamSlug:
          type: string
          nullable: true
        teamName:
          type: string
          nullable: true
        requests:
          type: integer
          format: int64
        inputTokens:
          type: integer
          format: int64
        outputTokens:
          type: integer
          format: int64
        cacheReadTokens:
          type: integer
          format: int64
        cacheWriteTokens:
          type: integer
          format: int64
        costUsd:
          type: number
          format: double
          description: Estimated from the models' current prices
        unpricedRequests:
          type: integer
          format: int64
          description: Requests of models without prices (not in costUsd)
    UsageReport:
      type: object
      required: [from, to, groupBy, rows, total]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        groupBy:
          type: string
          enum: [day, model, agent, team, 'agent,day']
        rows:
          type: array
          items:
            $ref: '#/components/schemas/UsageRow'
        total:
          $ref: '#/components/schemas/UsageRow'
    ProviderType:
      type: object
      required: [id, name, api, authHeader]
      properties:
        id:
          type: string
          enum: [openai, anthropic, openai-compatible, openai-responses, anthropic-compatible]
        name:
          type: string
        api:
          type: string
          description: The API agents speak to it (openai-responses, anthropic-messages, openai-completions)
        defaultBaseUrl:
          type: string
          nullable: true
        authHeader:
          type: string
          enum: [authorization, x-api-key]
    ModelProvider:
      type: object
      required: [id, name, kind, baseUrl, accessMode, enabled, hasHeaders, modelCount, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [openai, anthropic, openai-compatible, openai-responses, anthropic-compatible]
        baseUrl:
          type: string
        accessMode:
          type: string
          enum: [proxy, direct]
          description: 'proxy: agents call the platform, which adds the key and counts usage; direct: agents get the URL and key'
        enabled:
          type: boolean
        hasHeaders:
          type: boolean
          description: Whether extra headers are set (their values are never returned)
        modelCount:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        team:
          allOf:
          - $ref: '#/components/schemas/ModelOwner'
          nullable: true
          x-omitempty: false
          description: The team that owns the provider (null for a platform provider)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ModelOwner:
      type: object
      required: [id, slug, name, kind]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [team, personal]
    ModelSettings:
      type: object
      required: [teamsMayAddProviders, privateNetworks, revision, updatedAt]
      properties:
        teamsMayAddProviders:
          type: boolean
          description: Team owners and admins may add model providers for their teams
        teamsMayAddMcpServers:
          type: boolean
          x-omitempty: false
          description: Team owners and admins may add MCP servers for their teams (always present)
        privateNetworks:
          type: array
          items:
            type: string
          description: >-
            Private CIDRs teams' own model providers and MCP servers may be on (public addresses are always allowed)
        revision:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    ModelSettingsUpdate:
      type: object
      required: [teamsMayAddProviders, privateNetworks]
      properties:
        teamsMayAddProviders:
          type: boolean
        teamsMayAddMcpServers:
          type: boolean
          description: Omitted keeps the current setting
        privateNetworks:
          type: array
          maxItems: 50
          items:
            type: string
          description: Private CIDRs such as 10.20.0.0/16 (not loopback, link-local or public ranges)
    ModelProviderCreate:
      type: object
      required: [name, kind, apiKey]
      properties:
        name:
          type: string
          maxLength: 100
        kind:
          type: string
          enum: [openai, anthropic, openai-compatible, openai-responses, anthropic-compatible]
        baseUrl:
          type: string
          maxLength: 2048
          description: 'Default for openai and anthropic; required otherwise (for example https://litellm.example.com/v1)'
        apiKey:
          type: string
          maxLength: 4096
          writeOnly: true
        accessMode:
          type: string
          enum: [proxy, direct]
          description: Default proxy (a team's providers are proxy only)
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
          description: Extra headers sent with every request (at most 20)
        enabled:
          type: boolean
    ModelProviderUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        baseUrl:
          type: string
          maxLength: 2048
        apiKey:
          type: string
          maxLength: 4096
          writeOnly: true
          description: Replaces the key
        accessMode:
          type: string
          enum: [proxy, direct]
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
          description: Replaces every extra header ({} removes them)
        enabled:
          type: boolean
    DiscoveredModel:
      type: object
      required: [id, name, added]
      properties:
        id:
          type: string
          description: The provider's model ID
        name:
          type: string
        contextWindow:
          type: integer
          format: int32
          nullable: true
        added:
          type: boolean
          description: Whether the catalog already has it
    ModelTeam:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    Model:
      type: object
      required: [id, providerId, providerName, providerKind, upstreamId, name, contextWindow, maxTokens, images, reasoning, enabled, visibility, personal, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        providerName:
          type: string
        providerKind:
          type: string
        providerEnabled:
          type: boolean
          nullable: true
        accessMode:
          type: string
          nullable: true
          enum: [proxy, direct]
        upstreamId:
          type: string
          description: The provider's ID for the model
        name:
          type: string
        contextWindow:
          type: integer
          format: int32
        maxTokens:
          type: integer
          format: int32
        images:
          type: boolean
          description: Accepts images
        reasoning:
          type: boolean
        inputPrice:
          type: number
          format: double
          nullable: true
          description: USD per million input tokens
        outputPrice:
          type: number
          format: double
          nullable: true
          description: USD per million output tokens
        enabled:
          type: boolean
        visibility:
          type: string
          enum: [all, teams]
          description: 'all: every team may use it; teams: the listed teams'
        personal:
          type: boolean
          description: Available in personal workspaces (when created, defaults to visibility = all)
        teams:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ModelTeam'
        providerTeam:
          allOf:
          - $ref: '#/components/schemas/ModelOwner'
          nullable: true
          x-omitempty: false
          description: The team that owns the model's provider (null for a platform provider); its models are that team's only
        revision:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ModelCreate:
      type: object
      required: [upstreamId]
      properties:
        upstreamId:
          type: string
          maxLength: 200
        name:
          type: string
          maxLength: 100
          description: Defaults to upstreamId
        contextWindow:
          type: integer
          format: int32
          description: Default 128000
        maxTokens:
          type: integer
          format: int32
          description: Default 16000
        images:
          type: boolean
        reasoning:
          type: boolean
        inputPrice:
          type: number
          format: double
        outputPrice:
          type: number
          format: double
        enabled:
          type: boolean
        visibility:
          type: string
          enum: [all, teams]
        personal:
          type: boolean
          description: Available in personal workspaces (when created, defaults to visibility = all)
        teams:
          type: array
          items:
            type: string
          description: Team slugs or IDs (visibility teams)
    ModelUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        contextWindow:
          type: integer
          format: int32
        maxTokens:
          type: integer
          format: int32
        images:
          type: boolean
        reasoning:
          type: boolean
        inputPrice:
          type: number
          format: double
          description: A negative value clears it
        outputPrice:
          type: number
          format: double
          description: A negative value clears it
        enabled:
          type: boolean
        visibility:
          type: string
          enum: [all, teams]
        personal:
          type: boolean
          description: Available in personal workspaces (when created, defaults to visibility = all)
        teams:
          type: array
          items:
            type: string
          description: Replaces the teams (visibility teams)
    AgentModel:
      type: object
      required: [id, name, providerName, source, available]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        providerName:
          type: string
        source:
          type: string
          enum: [agent, template]
          description: 'agent: chosen for this agent; template: its template version''s'
        available:
          type: boolean
          description: False when the model was disabled or unpublished; the agent does not start until moved to another
    AgentTemplate:
      type: object
      required: [id, slug, name, description, status, archived, currentVersion, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: assistant
        name:
          type: string
        description:
          type: string
        teamId:
          type: string
          format: uuid
          nullable: true
          description: The owning team; absent for platform templates
        teamSlug:
          type: string
          nullable: true
        teamName:
          type: string
          nullable: true
        status:
          type: string
          enum: [private, pending, published]
          description: 'private: the team only; pending: waiting for a platform admin; published: in the catalog'
        reviewNote:
          type: string
          nullable: true
          description: Why the last request to publish was rejected
        archived:
          type: boolean
        currentVersion:
          type: integer
          format: int32
        agentCount:
          type: integer
          format: int64
          nullable: true
          description: How many agents use it (one template's view only)
        revision:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AgentTemplateCreate:
      type: object
      required: [slug, name, instructions]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$'
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        instructions:
          type: string
          maxLength: 20000
          description: The agent's system prompt (version 1)
        notes:
          type: string
          maxLength: 2000
        modelId:
          type: string
          format: uuid
          description: The model version 1 runs on (default the platform's default model)
        mcp:
          type: array
          items:
            $ref: '#/components/schemas/McpAttach'
          description: MCP servers its agents get
        clientMcp:
          type: boolean
          description: Let apps give its agents MCP servers for a thread
        approvals:
          allOf:
          - $ref: '#/components/schemas/ToolApprovalPolicyInput'
          description: Tools that ask a person first (version 1; default none)
        agentSchedules:
          type: boolean
          description: Let its agents set their own reminders and recurring work (the schedule tool)
        kind:
          allOf:
          - $ref: '#/components/schemas/AgentKind'
          description: Which of the runtime's compositions its agents run (version 1; default assistant)
        kindSettings:
          allOf:
          - $ref: '#/components/schemas/AgentKindSettings'
          description: The kind's settings (version 1; omitted fields take the kind's defaults)
    AgentTemplateUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        archived:
          type: boolean
    AgentTemplateVersion:
      type: object
      required: [version, instructions, notes, createdAt]
      properties:
        version:
          type: integer
          format: int32
        instructions:
          type: string
        notes:
          type: string
        createdByName:
          type: string
          nullable: true
        modelId:
          type: string
          format: uuid
          nullable: true
          description: Its model (absent - the platform's default)
        modelName:
          type: string
          nullable: true
        modelProviderName:
          type: string
          nullable: true
        mcp:
          type: array
          items:
            $ref: '#/components/schemas/McpAttached'
        clientMcp:
          type: boolean
        approvals:
          $ref: '#/components/schemas/ToolApprovalPolicy'
        agentSchedules:
          type: boolean
          description: Its agents may set their own schedules (the runtime's schedule tool)
        kind:
          $ref: '#/components/schemas/AgentKind'
        kindSettings:
          $ref: '#/components/schemas/AgentKindSettings'
        createdAt:
          type: string
          format: date-time
    AgentTemplateVersionCreate:
      type: object
      required: [instructions]
      properties:
        instructions:
          type: string
          maxLength: 20000
        notes:
          type: string
          maxLength: 2000
          description: What changed
        modelId:
          type: string
          description: The model it runs on (a model's ID; "" for the platform's default; omitted keeps the current version's)
        mcp:
          type: array
          items:
            $ref: '#/components/schemas/McpAttach'
          description: MCP servers its agents get (omitted keeps the current version's; [] none)
        clientMcp:
          type: boolean
          description: Let apps give its agents MCP servers for a thread (omitted keeps the current version's)
        approvals:
          allOf:
          - $ref: '#/components/schemas/ToolApprovalPolicyInput'
          description: Tools that ask a person first (omitted keeps the current version's, and so does a field omitted inside)
        agentSchedules:
          type: boolean
          description: >-
            Let its agents set their own reminders and recurring work (the schedule tool; omitted keeps the current
            version's)
        kind:
          allOf:
          - $ref: '#/components/schemas/AgentKind'
          description: Which of the runtime's compositions its agents run (omitted keeps the current version's)
        kindSettings:
          allOf:
          - $ref: '#/components/schemas/AgentKindSettings'
          description: >-
            The kind's settings, as a whole (omitted keeps the current version's when the kind stays the same, and
            takes the new kind's defaults when it changes; omitted fields inside take the kind's defaults)
    AgentTemplateReview:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        note:
          type: string
          maxLength: 2000
          description: Shown to the team when rejected
    Agent:
      type: object
      required: [id, name, description, teamId, teamSlug, teamName, templateId, templateSlug, templateName, templateVersion, templateCurrentVersion, serviceManaged, enabled, running, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        teamId:
          type: string
          format: uuid
        teamSlug:
          type: string
        teamName:
          type: string
        templateId:
          type: string
          format: uuid
        templateSlug:
          type: string
        templateName:
          type: string
        templateVersion:
          type: integer
          format: int32
          description: The template version the agent runs
        templateCurrentVersion:
          type: integer
          format: int32
          description: The template's newest version (an upgrade is available when it is higher)
        externalKey:
          type: string
          nullable: true
          description: The key it was ensured with (PUT .../agents/by-key/{key}), if any
        serviceManaged:
          type: boolean
          description: >-
            An app's agent for one of its users (made by a service account with an external key, in a shared team):
            only the team's service accounts use it. An agent with a key in a personal workspace is not.
        enabled:
          type: boolean
        running:
          type: boolean
          description: Whether its runtime is up now (it hibernates when idle and wakes on the next request)
        awake:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AgentAwake'
          description: >-
            Why it isn't hibernating, from its runtime's own report: only on GET /v1/agents/{agentId}, while it runs and
            its runtime answers (absent otherwise, and in lists)
        model:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AgentModel'
          description: The model it runs on (absent - the platform's default model)
        storageVersion:
          type: string
          nullable: true
          description: >-
            The newest pi-durable version that has written the agent's storage, as its runtimes reported it (absent:
            none recorded yet). The platform refuses to start the agent on a runtime with an older one.
        runtimeRefused:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AgentRuntimeRefusal'
          description: >-
            The platform refused to start the agent on its runtime, which is older than the one that last wrote its
            data (absent: no refusal since the last start). Requests that wake it answer 409 runtime_too_old.
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revision:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AgentRuntimeRefusal:
      type: object
      required: [runtimeVersion, storageVersion, at, message]
      description: Why the agent's runtime was refused (the upgrade check, docs/custom-agents.md)
      properties:
        runtimeVersion:
          type: string
          description: The refused runtime's pi-durable version (empty - it reported none)
        storageVersion:
          type: string
          description: The pi-durable version that has written the agent's storage
        at:
          type: string
          format: date-time
          description: When the latest start was refused
        message:
          type: string
    AgentAwake:
      type: object
      description: What keeps a running agent from hibernating (docs/hibernation.md)
      required: [reasons, backgroundTasks, waitingForPerson, overCeiling]
      properties:
        reasons:
          type: array
          description: >-
            reply - a thread is replying; stream - someone is watching a thread; background - background work (tasks,
            background subagents) younger than the platform's ceiling; recent - it was used within the idle timeout.
            Empty: it hibernates at the idle reaper's next pass.
          items:
            type: string
            enum: [reply, stream, background, recent]
        backgroundTasks:
          type: integer
          format: int32
          description: Units of background work keeping it awake (at most 1000)
        backgroundSince:
          type: string
          format: date-time
          nullable: true
          description: When the oldest of them started
        waitingForPerson:
          type: integer
          format: int32
          description: Its tasks waiting for a person's answer (an approval, a question); they don't keep it awake
        overCeiling:
          type: boolean
          description: Background work older than the platform's ceiling, which the reaper aborts at its next pass
    AgentCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        template:
          type: string
          description: A platform template's slug (default assistant), when templateId is not given
        templateId:
          type: string
          format: uuid
          description: The template (from the catalog, or the team's own)
        modelId:
          type: string
          format: uuid
          description: A model published to the team (default the template's)
    AgentEnsure:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: Defaults to the external key
        description:
          type: string
          maxLength: 2000
        template:
          type: string
          description: A platform template's slug (default assistant), when templateId is not given
        templateId:
          type: string
          format: uuid
        modelId:
          type: string
          format: uuid
          description: For a new agent, a model published to the team (default the template's)
    AgentMove:
      type: object
      required: [team]
      properties:
        team:
          type: string
          description: The target team's slug or ID
        modelId:
          type: string
          format: uuid
          description: A model to switch to as part of the move (one the target team may use); default the agent's
    AgentMoveTeam:
      type: object
      required: [id, slug, name, kind]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [team, personal]
    AgentMoveBlocker:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: The error code the move would be refused with
          example: move_template_unavailable
        message:
          type: string
    AgentMovePlan:
      type: object
      required: [agentId, from, to, allowed, blockers, sharedThreads, privateThreads, privateThreadsUnreachable, targetMembers,
        targetServiceAccounts, peopleLosingAccess, serviceAccountsLosingAccess, threadMcpServers, mcpServersDropped]
      properties:
        agentId:
          type: string
          format: uuid
        from:
          $ref: '#/components/schemas/AgentMoveTeam'
        to:
          $ref: '#/components/schemas/AgentMoveTeam'
        allowed:
          type: boolean
          description: Whether the move would be done now (no blockers)
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/AgentMoveBlocker'
        sharedThreads:
          type: integer
          format: int64
          description: Shared threads, which everyone who may use the agent in the target team will see
        privateThreads:
          type: integer
          format: int64
          description: Private threads; they stay their creator's
        privateThreadsUnreachable:
          type: integer
          format: int64
          description: Private threads whose creator can't use the agent in the target team (a service account, or a person who isn't a member)
        targetMembers:
          type: integer
          format: int64
          description: People in the target team (who may use the agent after the move)
        targetServiceAccounts:
          type: integer
          format: int64
          description: The target team's service accounts (who may use the agent after the move)
        peopleLosingAccess:
          type: integer
          format: int64
          description: People of the current team who aren't in the target team
        serviceAccountsLosingAccess:
          type: integer
          format: int64
          description: The current team's service accounts, whose keys no longer reach the agent
        externalKey:
          type: string
          nullable: true
          description: The agent's key, dropped by the move (PUT .../agents/by-key/{key} no longer finds it)
        threadMcpServers:
          type: integer
          format: int64
          description: MCP servers apps set on its threads, removed by the move
        triggers:
          type: integer
          format: int64
          description: Its triggers (schedules and webhooks), deleted by the move
        mcpServersDropped:
          type: array
          description: Names of its template version's MCP servers that the target team may not use (they stop applying)
          items:
            type: string
        model:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AgentModel'
          description: The model it would run on in the target team (absent - the platform's default model)
    AgentUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        enabled:
          type: boolean
        templateVersion:
          type: integer
          format: int32
          description: Move to another version of the template (upgrade or roll back); applies when the agent next starts
        modelId:
          type: string
          description: A model published to the team, or "" for its template's; applies when the agent next starts
    AgentThread:
      type: object
      required: [threadId, title, createdAt, updatedAt, busy, visibility, participants]
      properties:
        threadId:
          type: string
        title:
          type: string
        createdAt:
          type: integer
          format: int64
          description: Unix milliseconds
        updatedAt:
          type: integer
          format: int64
          description: Unix milliseconds; moves when a message is sent and when a reply finishes
        busy:
          type: boolean
          description: A reply is in progress
        lastReplyAt:
          type: integer
          format: int64
          nullable: true
          description: When the last reply finished (Unix milliseconds)
        lastError:
          type: string
          nullable: true
          description: Why the last reply failed (absent when it succeeded)
        visibility:
          $ref: '#/components/schemas/ThreadVisibility'
        createdBy:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/ThreadPrincipal'
          description: Who started the thread (absent when unknown, such as threads begun before the platform recorded it)
        participants:
          type: array
          description: Everyone who has sent to the thread, first sender first
          items:
            $ref: '#/components/schemas/ThreadParticipant'
    ThreadVisibility:
      type: string
      enum: [shared, private]
      description: >-
        shared: everyone who may use the agent sees the thread. private: only the person or service account that started
        it (not other members, not the team's owners or admins). Chosen when the thread starts (createAgentThread, its
        first message, or its MCP servers being set); it never changes.
    ThreadPrincipal:
      type: object
      required: [kind, id, name]
      properties:
        kind:
          type: string
          enum: [user, service_account]
        id:
          type: string
          format: uuid
        name:
          type: string
          description: A person's display name (else email), or a service account's name
    ThreadParticipant:
      type: object
      required: [kind, id, name, lastSentAt]
      properties:
        kind:
          type: string
          enum: [user, service_account]
        id:
          type: string
          format: uuid
        name:
          type: string
        lastSentAt:
          type: integer
          format: int64
          description: When they last sent to the thread (Unix milliseconds)
    AdminAgentThread:
      type: object
      description: >-
        A thread as platform admins list it. The title of a private thread, of every thread of a personal
        workspace's agent and of every thread of a service-managed (by-key) agent is withheld (null, titleHidden):
        reading one takes a reason (adminReadAgentThread).
      required: [threadId, title, titleHidden, createdAt, updatedAt, busy, visibility, participants]
      properties:
        threadId:
          type: string
        title:
          type: string
          nullable: true
        titleHidden:
          type: boolean
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
        busy:
          type: boolean
        lastReplyAt:
          type: integer
          format: int64
          nullable: true
        lastError:
          type: string
          nullable: true
        visibility:
          $ref: '#/components/schemas/ThreadVisibility'
        createdBy:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/ThreadPrincipal'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ThreadParticipant'
    AdminThreadRead:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Why the conversation is opened; recorded in the agent's team's audit log
    AgentThreadUpdate:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
    AgentThreadCreate:
      type: object
      properties:
        visibility:
          $ref: '#/components/schemas/ThreadVisibility'
        title:
          type: string
          maxLength: 200
    AgentThreadEvent:
      type: object
      required: [agentId, threadId, deleted]
      properties:
        agentId:
          type: string
          format: uuid
        threadId:
          type: string
        deleted:
          type: boolean
        thread:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AgentThread'
          description: The thread now (absent when deleted)
    AgentMessageCreate:
      type: object
      required: [text]
      description: >-
        The platform records the thread (its creator and visibility) before relaying the first message. Another's
        private thread reads as not found (404 thread_not_found), on this and every thread route. If the thread ID
        was reserved by someone else (they set its MCP servers before any message), this message still goes through,
        but the servers they set are dropped and not active for it; send `mcpServers` to give the thread your own.
      properties:
        text:
          type: string
          maxLength: 32000
        requestId:
          type: string
          description: Idempotency key; a repeated one is not submitted again
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        mcpServers:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ClientMcpServer'
          description: >-
            The MCP servers this thread's user enabled in the app (replaces the thread's; [] removes them). For template
            versions with clientMcp, on hosts the platform allows. Never forwarded to the agent: the platform keeps them.
        visibility:
          allOf:
          - $ref: '#/components/schemas/ThreadVisibility'
          description: >-
            The thread's visibility, chosen with its first message (default shared). On a later message it may be
            omitted; a different value is refused (409 visibility_fixed). The message's author is always the caller:
            author fields a client sends are ignored.
        whenBusy:
          type: string
          enum: [followUp, steer]
          description: >-
            While a reply is running: followUp (the default) waits for it to end and starts the next one; steer joins it, placed
            after its current tool round (or its answer) so the model sees it before going on. The transcript shows a
            steering message where it was placed: after the tool results of the reply it changed. No effect on an
            idle thread.
    AgentMessageAccepted:
      type: object
      required: [submissionId]
      properties:
        submissionId:
          type: integer
          format: int64
    ChatToolCall:
      type: object
      required: [id, name, arguments]
      properties:
        id:
          type: string
        name:
          type: string
        arguments:
          type: object
          additionalProperties: true
        startedAt:
          type: integer
          format: int64
          description: When the call was made (the assistant message's time, Unix milliseconds)
        endedAt:
          type: integer
          format: int64
          description: When its result arrived (Unix milliseconds; absent while it runs)
        approval:
          $ref: '#/components/schemas/ChatApproval'
    ChatApproval:
      type: object
      required: [id, callId, tool, status, requestedAt]
      description: >-
        A request to approve a tool call, as the thread's view shows it: on the call (without arguments) and in the
        view's pending list (with a redacted view of the arguments)
      properties:
        id:
          type: string
        callId:
          type: string
        tool:
          type: string
        status:
          $ref: '#/components/schemas/ToolApprovalStatus'
        requestedAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        summary:
          type: string
          description: Why approval is asked (from the agent's own hook)
        requestedFor:
          $ref: '#/components/schemas/ChatAuthor'
        decidedAt:
          type: integer
          format: int64
        decidedBy:
          $ref: '#/components/schemas/ApprovalDecider'
        reason:
          type: string
        arguments:
          type: object
          additionalProperties: true
    ApprovalDecider:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [user, service_account, system]
        id:
          type: string
        name:
          type: string
    AgentKind:
      type: string
      enum: [assistant, triage, researcher]
      description: >-
        Which of the runtime's compositions a template version's agents run (docs/first-party-agents.md): assistant
        (the default), triage, or researcher (the deep researcher)
    AgentKindSettings:
      type: object
      additionalProperties: false
      description: >-
        A kind's settings (docs/first-party-agents.md). Each field belongs to one kind; a field of another kind is
        refused (invalid_kind_settings). The assistant takes none. Versions return every field of their kind, with
        its default.
      properties:
        listTools:
          type: array
          maxItems: 50
          items:
            type: string
            pattern: '^[A-Za-z0-9_.*-]{1,200}$'
          description: 'Triage: MCP tools that list new or open items (names, or patterns with *)'
        readTools:
          type: array
          maxItems: 50
          items:
            type: string
            pattern: '^[A-Za-z0-9_.*-]{1,200}$'
          description: 'Triage: MCP tools that read one item'
        writeTools:
          type: array
          maxItems: 50
          items:
            type: string
            pattern: '^[A-Za-z0-9_.*-]{1,200}$'
          description: 'Triage: MCP tools that write (comment, label, close)'
        approveWrites:
          type: boolean
          description: 'Triage: every write tool asks a person first (default true; added to the version''s approvals)'
        backgroundSubagents:
          type: boolean
          description: 'Researcher: long questions run in background subagents (default true; never in a triggered run)'
        maxPlanSteps:
          type: integer
          format: int32
          minimum: 1
          maximum: 20
          description: 'Researcher: the most steps a plan may have (default 8)'
    ToolApprovalStatus:
      type: string
      enum: [pending, approved, denied, timed_out, cancelled]
    ToolApprovalPolicy:
      type: object
      required: [tools, role, timeoutSeconds]
      description: Which tools of a template version ask a person before they run (docs/approvals.md)
      properties:
        tools:
          type: array
          maxItems: 100
          items:
            type: string
            pattern: '^[A-Za-z0-9_.*-]{1,200}$'
          description: Tool names, or patterns where * stands for any characters (mcp__github__*); [] for none
        role:
          type: string
          enum: [admin, editor, member]
          description: >-
            The lowest team role that may decide calls in shared threads besides the person the run is for (admin:
            owners and admins only, the default)
        timeoutSeconds:
          type: integer
          format: int32
          minimum: 60
          maximum: 2592000
          description: How long a request waits before it is denied (default 86400)
    ToolApprovalPolicyInput:
      type: object
      properties:
        tools:
          type: array
          maxItems: 100
          items:
            type: string
        role:
          type: string
          enum: [admin, editor, member]
        timeoutSeconds:
          type: integer
          format: int32
    ToolApproval:
      type: object
      required: [id, agentId, agentName, threadId, tool, callId, arguments, status, requestedAt, expiresAt, canDecide]
      properties:
        id:
          type: string
        agentId:
          type: string
          format: uuid
        agentName:
          type: string
        threadId:
          type: string
        threadTitle:
          type: string
          nullable: true
        tool:
          type: string
        callId:
          type: string
        arguments:
          type: object
          additionalProperties: true
          description: >-
            A bounded, redacted view: values under credential-like keys read [redacted], strings are cut at 2,000
            characters, the whole at 16 KiB
        summary:
          type: string
          description: Why approval is asked (from the agent's own hook)
        requestedFor:
          $ref: '#/components/schemas/ApprovalDecider'
        status:
          $ref: '#/components/schemas/ToolApprovalStatus'
        requestedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true
        decidedBy:
          $ref: '#/components/schemas/ApprovalDecider'
        reason:
          type: string
          description: The decider's reason, given to the model on denial
        canDecide:
          type: boolean
          description: The caller may decide it (it is pending and they are allowed)
    ToolApprovalDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, deny]
        reason:
          type: string
          maxLength: 1000
          description: Given to the model on denial
    ChatAuthor:
      type: object
      required: [kind, id, name]
      description: Who sent a user message, as the platform recorded it (a trigger - an unattended run; id is the trigger's)
      properties:
        kind:
          type: string
          enum: [user, service_account, trigger]
        id:
          type: string
        name:
          type: string
        via:
          type: string
          description: The app a person sent it through (OAuth Connect)
    ChatModel:
      type: object
      required: [provider, id]
      properties:
        provider:
          type: string
        id:
          type: string
    ChatUsage:
      type: object
      required: [input, output, cacheRead, cacheWrite, total]
      description: Tokens of one model response
      properties:
        input:
          type: integer
          format: int64
        output:
          type: integer
          format: int64
        cacheRead:
          type: integer
          format: int64
        cacheWrite:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    ChatMessage:
      type: object
      required: [id, role]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant, tool]
        text:
          type: string
        thinking:
          type: string
        toolCalls:
          type: array
          items:
            $ref: '#/components/schemas/ChatToolCall'
        error:
          type: string
          description: An assistant reply that failed or was interrupted
        toolCallId:
          type: string
        name:
          type: string
          description: Tool name (tool results)
        isError:
          type: boolean
        details:
          description: >-
            A tool result's details: structured data the tool returned for UIs (any JSON, at most 16 KiB; larger ones
            are left out and detailsOmitted is true). Not shown to the model.
        detailsOmitted:
          type: boolean
          description: The tool's details were larger than 16 KiB and left out
        author:
          $ref: '#/components/schemas/ChatAuthor'
        at:
          type: integer
          format: int64
          description: When the message was sent or the reply started (Unix milliseconds)
        model:
          $ref: '#/components/schemas/ChatModel'
        usage:
          $ref: '#/components/schemas/ChatUsage'
        stopReason:
          type: string
          description: Why an assistant reply ended (stop, length, toolUse, error, aborted)
    ChatToolSlot:
      type: object
      required: [callId, name, status]
      properties:
        callId:
          type: string
        name:
          type: string
        status:
          type: string
        output:
          type: string
        details:
          description: What the running tool has published for UIs so far (JSON, at most 16 KiB)
        detailsOmitted:
          type: boolean
          description: The details were larger than 16 KiB and left out
    ChatDocumentRef:
      type: object
      required: [revision]
      properties:
        revision:
          type: string
          description: Changes when the document does (a hash of its content)
    ThreadDocument:
      type: object
      required: [kind, version, revision, value]
      description: An exposed document of a conversation
      properties:
        kind:
          type: string
        version:
          type: integer
          description: The version of the document's shape (its definition's; values are migrated to it when read)
        revision:
          type: string
          description: As in the thread's view; changes when the document does
        value:
          type: object
          additionalProperties: true
          description: The document (JSON, at most the size its author exposes, 1 MiB at most)
    ChatView:
      type: object
      required: [busy, messages, tools]
      properties:
        busy:
          type: boolean
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        partial:
          type: object
          required: [text, thinking]
          description: The assistant reply being generated
          properties:
            text:
              type: string
            thinking:
              type: string
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ChatToolSlot'
        earlierCursor:
          type: string
          description: Paged reads only; pass it as `before` for the earlier messages (absent when there are none)
        documents:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ChatDocumentRef'
          description: >-
            The documents the agent exposes that the conversation has, by kind, with their revisions (absent when it
            has none). Read one with getAgentThreadDocument.
        approvals:
          type: array
          description: The thread's tool calls waiting for a person's approval (absent when there are none)
          items:
            $ref: '#/components/schemas/ChatApproval'
    ChatDeltaEvent:
      type: object
      required: [type, seq]
      description: >-
        One event of a thread's delta stream (`format=delta`, version 1). Which fields are set depends on `type`;
        see the stream's description.
      properties:
        type:
          type: string
          enum: [snapshot, message.added, message.updated, partial.set, partial.appended, partial.cleared, tool.started,
            tool.updated, tool.finished, tool.removed, tools.set, run, document.updated, approvals.set]
        seq:
          type: integer
          format: int64
        v:
          type: integer
          description: The format's version (snapshot)
        view:
          $ref: '#/components/schemas/ChatView'
        message:
          $ref: '#/components/schemas/ChatMessage'
        partial:
          type: object
          required: [text, thinking]
          properties:
            text:
              type: string
            thinking:
              type: string
        text:
          type: string
          description: partial.appended
        thinking:
          type: string
          description: partial.appended
        tool:
          $ref: '#/components/schemas/ChatToolSlot'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ChatToolSlot'
        callId:
          type: string
        status:
          type: string
        output:
          type: string
          nullable: true
        outputAppended:
          type: string
        startedAt:
          type: integer
          format: int64
          description: When the tool call started (Unix milliseconds)
        elapsedMs:
          type: integer
          format: int64
          description: How long the tool call had run when the event was sent
        details:
          description: tool.updated and tool.finished - the tool's new details (null - none)
        detailsOmitted:
          type: boolean
          description: tool.updated and tool.finished - whether the details are now too large to send
        busy:
          type: boolean
        kind:
          type: string
          description: document.updated - the document's kind
        revision:
          type: string
          description: document.updated - its new revision
        approvals:
          type: array
          description: 'approvals.set: the thread''s pending approvals now ([] none)'
          items:
            $ref: '#/components/schemas/ChatApproval'
    AuditActor:
      type: object
      description: Who made the change, resolved when the log is read
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - user
          - api_key
          - service_account
          - oauth
          - system
          - agent
        userId:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
          description: The agent (agent actors, which change only their own schedules)
        displayName:
          type: string
        email:
          type: string
        apiKeyName:
          type: string
          description: The API key used (api_key actors)
        oauthClient:
          type: string
          description: The connected app the person acted through (oauth actors)
    AuditEntry:
      type: object
      required:
      - id
      - occurredAt
      - actorKind
      - actor
      - action
      - targetType
      - targetId
      - targetLabel
      - targetExists
      - metadata
      - requestId
      properties:
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        actorKind:
          type: string
          enum:
          - user
          - api_key
          - oauth
          - system
          - agent
        actorUserId:
          type: string
          format: uuid
          nullable: true
        teamId:
          type: string
          format: uuid
          nullable: true
        teamName:
          type: string
          nullable: true
          description: The team's name for a team's entry (null for platform entries, or when the team was deleted)
        teamSlug:
          type: string
          nullable: true
          description: The team's slug, with teamName
        action:
          type: string
          example: team.member_add
        actor:
          $ref: '#/components/schemas/AuditActor'
        targetType:
          type: string
        targetId:
          type: string
        targetLabel:
          type: string
          nullable: true
          description: The target's current name, resolved when the log is read. For a deleted target, the last name recorded
            in the audit log; null when none is known.
        targetExists:
          type: boolean
          description: Whether the target still exists (deleted and soft-deleted targets are false)
        before:
          description: Configuration before the change
          nullable: true
        after:
          description: Configuration after the change
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        requestId:
          type: string
        via:
          allOf:
          - $ref: '#/components/schemas/AuditVia'
          nullable: true
          description: How the person acted. Null for the systems entries.
        clientIp:
          type: string
          nullable: true
          description: The caller's address as recorded, in the platform log only (null in a team's log, or when none was
            recorded).
    AuditPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        nextCursor:
          type: string
          nullable: true
    AuditVia:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - session
          - api_key
          - oauth
          description: 'session: signed in to the web app; api_key: with an API key; oauth: through an app the person
            connected.'
        name:
          type: string
          description: The API key's or the app's name, when known
    AuthConfig:
      type: object
      required:
      - oidcEnabled
      - devAuthEnabled
      - loginUrl
      - devAccounts
      - instance
      properties:
        instance:
          $ref: '#/components/schemas/InstanceInfo'
        oidcEnabled:
          type: boolean
        devAuthEnabled:
          type: boolean
        loginUrl:
          type: string
        devAccounts:
          type: array
          items:
            $ref: '#/components/schemas/DevAccount'
        teamRequestUrl:
          type: string
          nullable: true
          description: Where people request a new team (only platform admins create teams)
        connect:
          $ref: '#/components/schemas/ConnectInfo'
    Capabilities:
      type: object
      required:
      - platformAdmin
      - platformAuditor
      properties:
        platformAdmin:
          type: boolean
        platformAuditor:
          type: boolean
    DevAccount:
      type: object
      required:
      - id
      - name
      - email
      - platformRole
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        platformRole:
          $ref: '#/components/schemas/PlatformRole'
    DevLoginRequest:
      type: object
      required:
      - account
      properties:
        account:
          type: string
