{{- if and .Values.networkPolicy.enabled .Values.metrics.enabled .Values.networkPolicy.metrics.from }}
# The metrics port is reachable by the scrapers named in
# networkPolicy.metrics.from, and by nobody else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pdp.fullname" . }}-ingress-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pdp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pdp.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.metrics.from | nindent 8 }}
      ports:
        - { protocol: TCP, port: {{ .Values.metrics.port }} }
{{- end }}
