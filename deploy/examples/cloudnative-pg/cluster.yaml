# PostgreSQL 17 for the platform with CloudNativePG (https://cloudnative-pg.io),
# NOT part of the chart or the Kustomize base. Install the operator first. Any
# PostgreSQL 17 works as well: see deploy/README.md.
#
#   * database pdp, owner pdp: platform metadata (users, teams, agents,
#     templates, audit). CloudNativePG creates the Secret pdp-db-app; its `uri`
#     key is the platform's DATABASE_URL.
#   * database pdp_agents, owner pdp_agents_admin: agent state. The platform
#     provisions one schema and one login role per agent there with this
#     CREATEROLE role (AGENTS_DATABASE_URL); agent pods connect with their own
#     role only and cannot read each other's schema.
#
# Create the Secret pdp-agents-admin first (secrets.example.yaml). Adjust
# storage, instances and resources. Each running agent holds one connection
# (two while it is replaced): size max_connections for your agents.
#
# Keep agents' roles out of the platform database. PostgreSQL lets PUBLIC
# connect to every database it creates, and an agent's role is a login role on
# the same server that runs code the platform doesn't trust. The platform's
# advisory locks (waking an agent, the reaper, migrations) live in database pdp:
# a role that can connect there could hold them and stop agents from waking or
# the platform from starting. Two steps, both below:
#   1. REVOKE CONNECT on pdp from PUBLIC and grant it to the platform's role
#      (postInitApplicationSQL runs once, when the cluster is created; on a
#      running cluster run the same statements yourself:
#        kubectl cnpg psql pdp-db -- -d pdp -c 'REVOKE CONNECT ON DATABASE pdp FROM PUBLIC' \
#          -c 'GRANT CONNECT ON DATABASE pdp TO pdp'
#      and add the same pair for any other database on the server that agents
#      must not reach, including `postgres`).
#   2. pg_hba rules that let agent roles (agent_<uuid>) reach pdp_agents only.
# `pi-durable-platform doctor` warns until PUBLIC can no longer connect.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pdp-db
  namespace: pi-durable-platform
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  primaryUpdateStrategy: unsupervised
  storage:
    size: 10Gi
  walStorage:
    size: 2Gi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }
  postgresql:
    parameters:
      max_connections: "200"
    # User-defined rules come before CloudNativePG's catch-all, and the first
    # match wins. Agent roles are named agent_<uuid without dashes>
    # (PostgreSQL 16+ reads a leading slash as a regular expression). Adjust
    # the connection type (host or hostssl) and add your own rules for the
    # platform and your operators after these.
    pg_hba:
      - host pdp_agents /^agent_ all scram-sha-256
      - host all /^agent_ all reject
  bootstrap:
    initdb:
      database: pdp
      owner: pdp
      postInitApplicationSQL:
        - REVOKE CONNECT ON DATABASE pdp FROM PUBLIC
        - GRANT CONNECT ON DATABASE pdp TO pdp
  managed:
    roles:
      - name: pdp_agents_admin
        ensure: present
        login: true
        createrole: true
        # Ending a stuck agent's sessions needs it for roles made before the
        # provisioner granted itself membership.
        inRoles: [pg_signal_backend]
        passwordSecret:
          name: pdp-agents-admin
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: pdp-agents
  namespace: pi-durable-platform
spec:
  cluster:
    name: pdp-db
  name: pdp_agents
  owner: pdp_agents_admin
  ensure: present
  databaseReclaimPolicy: retain
