# A PodDisruptionBudget (maxUnavailable 1): a node drain may evict one platform
# pod at a time. With the single replica of the base that is the whole platform
# (a short outage; minAvailable 1 would block drains instead); with
# components/replicas it keeps one replica up.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - pdb.yaml
