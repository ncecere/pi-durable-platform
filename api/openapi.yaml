          type: string
          nullable: true
          enum: [not_in_group, idp_refused, idp_unreachable]
          description: >-
            not_in_group: the provider's fresh claims lack an allowed group. idp_refused: it rejected the stored grant
            (person disabled, grant revoked or expired). idp_unreachable: it could not vouch for the person within the
            grace period (OIDC_GROUP_RECHECK_GRACE).
