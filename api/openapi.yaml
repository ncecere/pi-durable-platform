          description: The thread
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AgentThread'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
    get:
      tags:
      - agents
      operationId: getAgentThread
      summary: A conversation's transcript and the reply in progress
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ChatView'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '503':
          $ref: '#/components/responses/ErrorReply'
    delete:
      tags:
      - agents
      operationId: deleteAgentThread
      summary: Stop and remove a conversation from the agent's list
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Ok'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '503':
          $ref: '#/components/responses/ErrorReply'
  /v1/agents/{agentId}/threads/{threadId}/messages:
    parameters:
    - $ref: '#/components/parameters/AgentIdParam'
    - $ref: '#/components/parameters/ThreadIdParam'
    post:
      tags:
      - agents
      operationId: sendAgentMessage
      summary: Send a message (creates the thread on first use)
      description: Accepted, not answered; follow the thread's events for the reply. While the agent is busy the message runs after the current reply. A repeated requestId is not submitted twice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentMessageCreate'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AgentMessageAccepted'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '503':
          $ref: '#/components/responses/ErrorReply'
  /v1/agents/{agentId}/threads/{threadId}/stop:
    parameters:
    - $ref: '#/components/parameters/AgentIdParam'
    - $ref: '#/components/parameters/ThreadIdParam'
    post:
      tags:
      - agents
      operationId: stopAgentThread
      summary: Stop the reply in progress
      responses:
        '202':
          description: Stopped
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Ok'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '503':
          $ref: '#/components/responses/ErrorReply'
  /v1/agents/{agentId}/threads/{threadId}/events:
    parameters:
    - $ref: '#/components/parameters/AgentIdParam'
    - $ref: '#/components/parameters/ThreadIdParam'
    get:
      tags:
      - agents
      operationId: streamAgentThread
      summary: Server-sent events with the conversation's view after every change
      description: Each `view` event's data is a ChatView (JSON). The stream keeps the agent awake while open.
      parameters:
      - name: once
        in: query
        description: Send the current view as one event, then end the stream
        schema:
          type: boolean
      responses:
        '200':
          description: An event stream
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '503':
          $ref: '#/components/responses/ErrorReply'
  /v1/oauth/consent:
    get:
      tags:
      - oauth
      operationId: getOAuthConsent
      summary: The consent page's view of an app's authorization request (the person signed in)
      description: >-
        The query is the authorization request the app sent to /oauth/authorize, unchanged (the platform redirects the
        browser to the web app's /connect/consent with it). A request that isn't valid is a 400 whose code starts with
        oauth_ (the page shows the reason and never sends the browser anywhere).
      parameters:
      - name: client_id
        in: query
        required: false
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: false
        schema:
          type: string
      - name: response_type
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge_method
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: scope
        in: query
        required: false
        schema:
          type: string
      - name: resource
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The app, where it will send the person back, and what it asks for
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/OAuthConsent'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
    post:
      tags:
      - oauth
      operationId: decideOAuthConsent
      summary: Allow or deny an app's authorization request; returns where to send the browser
      description: >-
        Allowing records the person's consent (a connected app, remembered until revoked) and returns the app's
        redirect URI with an authorization code; denying returns it with error=access_denied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthConsentDecision'
      responses:
        '200':
          description: Where to send the browser
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/OAuthConsentResult'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
  /v1/me/oauth-grants:
    get:
      tags:
      - oauth
      operationId: listMyOAuthGrants
      summary: The apps the caller connected (newest first)
      responses:
        '200':
          description: Connected apps
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthGrant'
        '401':
          $ref: '#/components/responses/ErrorReply'
  /v1/me/oauth-grants/{grantId}:
    parameters:
    - $ref: '#/components/parameters/GrantIdParam'
    delete:
      tags:
      - oauth
      operationId: revokeMyOAuthGrant
      summary: Disconnect an app; its tokens stop working at once and its consent is forgotten
      responses:
        '200':
          $ref: '#/components/responses/OkReply'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/users/{userId}/oauth-grants:
    parameters:
    - $ref: '#/components/parameters/UserIdParam'
    get:
      tags:
      - oauth
      - admin
      operationId: adminListUserOAuthGrants
      summary: The apps a person connected (platform admins and auditors)
      responses:
        '200':
          description: Connected apps
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthGrant'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/users/{userId}/oauth-grants/{grantId}:
    parameters:
    - $ref: '#/components/parameters/UserIdParam'
    - $ref: '#/components/parameters/GrantIdParam'
    delete:
      tags:
      - oauth
      - admin
      operationId: adminRevokeUserOAuthGrant
      summary: Disconnect one of a person's apps (platform admins)
      responses:
        '200':
          $ref: '#/components/responses/OkReply'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/settings/oauth-clients:
    get:
      tags:
      - oauth
      - admin
      operationId: adminGetTrustedClients
      summary: Trusted apps, which skip the consent screen (platform admins and auditors)
      responses:
        '200':
          description: Trusted apps
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TrustedClients'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
    put:
      tags:
      - oauth
      - admin
      operationId: adminUpdateTrustedClients
      summary: Replace the trusted apps (platform admins)
      description: >-
        Only apps identified by a Client ID Metadata Document (an https URL with a path) can be trusted: a registered
        app's ID changes, and anyone can register any name. A trusted app skips the consent screen, never the sign-in.
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustedClientsUpdate'
      responses:
        '200':
          description: Trusted apps
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TrustedClients'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '412':
          $ref: '#/components/responses/ErrorReply'
        '422':
          $ref: '#/components/responses/ErrorReply'
        '428':
          $ref: '#/components/responses/ErrorReply'
components:
  headers:
    ETag:
      description: Quoted revision, for If-Match on the next update
      schema:
        type: string
  parameters:
    McpServerIdParam:
      name: serverId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderIdParam:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelIdParam:
      name: modelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateIdParam:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentIdParam:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ThreadIdParam:
      name: threadId
      in: path
      required: true
      description: Client-chosen thread ID (1-64 letters, digits, dashes or underscores)
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'
    AuditActionParam:
      name: action
      in: query
      required: false
      description: An exact action (team.member_add), or a prefix ending in a dot (team.) for every action in that group.
      schema:
        type: string
        maxLength: 100
        pattern: ^[a-z][a-z_]*\.[a-z_]*$
        example: team.
    AuditActorKindParam:
      name: actorKind
      in: query
      required: false
      description: Only entries by the system
      schema:
        type: string
        enum:
        - system
    AuditActorParam:
      name: actorUserId
      in: query
      required: false
      description: Only entries by this person (including their API keys)
      schema:
        type: string
        format: uuid
    AuditExcludeActionParam:
      name: excludeAction
      in: query
      required: false
      description: 'Action groups (prefixes ending in a dot, comma-separated) to leave out: auth. hides sign-ins and sign-outs.'
      schema:
        type: string
        maxLength: 100
        pattern: ^[a-z][a-z_]*\.(,[a-z][a-z_]*\.)*$
        example: auth.
    AuditFromParam:
      name: from
      in: query
      required: false
      description: Entries at or after this time
      schema:
        type: string
        format: date-time
    AuditTargetTypeParam:
      name: targetType
      in: query
      required: false
      schema:
        type: string
        maxLength: 64
        pattern: ^[a-z_]+$
        example: team
    AuditToParam:
      name: to
      in: query
      required: false
      description: Entries before this time (exclusive)
      schema:
        type: string
        format: date-time
    CursorParam:
      name: cursor
      in: query
      required: false
      description: nextCursor from the previous page
      schema:
        type: string
    IfMatchHeader:
      name: If-Match
      in: header
      required: true
      description: The resource's revision, as returned in ETag (for example "3"). Missing returns 428; stale returns 412.
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    SearchParam:
      name: q
      in: query
      required: false
      description: Case-insensitive substring match
      schema:
        type: string
        maxLength: 200
    TeamParam:
      name: team
      in: path
      required: true
      description: Team slug or ID
      schema:
        type: string
    GrantIdParam:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceAccountIdParam:
      name: serviceAccountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    AuditPageReply:
      description: A page of audit entries, newest first
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/AuditPage'
    ErrorReply:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    HealthReply:
      description: Health status
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/Health'
    OkReply:
      description: Success
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/Ok'
  schemas:
    PersonalWorkspaceSettings:
      type: object
      required: [enabled, maxAgents, maxRunning, revision, updatedAt]
      properties:
        enabled:
          type: boolean
          description: People get a personal workspace when they sign in
        maxAgents:
          type: integer
          format: int32
        maxRunning:
          type: integer
          format: int32
          description: Agents running at once
        monthlyBudgetUsd:
          type: number
          format: double
          nullable: true
          description: Recorded; not enforced yet
        revision:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    PersonalWorkspaceSettingsUpdate:
      type: object
      required: [enabled, maxAgents, maxRunning]
      properties:
        enabled:
          type: boolean
        maxAgents:
          type: integer
          format: int32
        maxRunning:
          type: integer
          format: int32
        monthlyBudgetUsd:
          type: number
          format: double
          nullable: true
    WorkspaceLimits:
      type: object
      required: [kind, agentCount, runningCount, overridden]
      properties:
        kind:
          type: string
          enum: [team, personal]
        maxAgents:
          type: integer
          format: int32
          nullable: true
        maxRunning:
          type: integer
          format: int32
          nullable: true
        monthlyBudgetUsd:
          type: number
          format: double
          nullable: true
        overridden:
          type: array
          items:
            type: string
          description: Which limits are this workspace's own (the others are the platform's defaults)
        agentCount:
          type: integer
          format: int64
        runningCount:
          type: integer
          format: int64
    WorkspaceLimitsUpdate:
      type: object
      properties:
        maxAgents:
          type: integer
          format: int32
          nullable: true
        maxRunning:
          type: integer
          format: int32
          nullable: true
        monthlyBudgetUsd:
          type: number
          format: double
          nullable: true
    McpTool:
      type: object
      required: [name]
      properties:
        name:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
    McpServer:
      type: object
      required: [id, name, slug, description, url, accessMode, enabled, visibility, personal, hasHeaders, tools, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          description: Names its tools for the model (mcp__<slug>__<tool>)
        description:
          type: string
        url:
          type: string
        accessMode:
          type: string
          enum: [proxy, direct]
          description: 'proxy: agents call the platform, which adds the headers, allows only their tools and logs calls; direct: agents get the URL and headers'
        enabled:
          type: boolean
        visibility:
          type: string
          enum: [all, teams]
        personal:
          type: boolean
          description: Available in personal workspaces (when created, defaults to visibility = all)
        teams:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ModelTeam'
        hasHeaders:
          type: boolean
        tools:
          type: array
          items:
            $ref: '#/components/schemas/McpTool'
        toolsRefreshedAt:
          type: string
          format: date-time
          nullable: true
        toolsError:
          type: string
          nullable: true
          description: Why the tools could not be read the last time
        revision:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    McpServerCreate:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          pattern: '^[a-z0-9](?:[a-z0-9_]{0,30}[a-z0-9])?$'
          description: Default from the name; cannot change later
        description:
          type: string
          maxLength: 2000
        url:
          type: string
          maxLength: 2048
          description: The server's Streamable HTTP endpoint
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
        accessMode:
          type: string
          enum: [proxy, direct]
        visibility:
          type: string
          enum: [all, teams]
        personal:
          type: boolean
          description: Available in personal workspaces (when created, defaults to visibility = all)
        teams:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    McpServerUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        url:
          type: string
          maxLength: 2048
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
          description: Replaces every header ({} removes them)
        accessMode:
          type: string
          enum: [proxy, direct]
        visibility:
          type: string
          enum: [all, teams]
        personal:
          type: boolean
          description: Available in personal workspaces (when created, defaults to visibility = all)
        teams:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    McpAttach:
      type: object
      required: [serverId]
      properties:
        serverId:
          type: string
          format: uuid
        tools:
          type: array
          nullable: true
          items:
            type: string
          description: Only these of its tools (absent - all)
    McpAttached:
      type: object
      required: [serverId, name, slug]
      properties:
        serverId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        tools:
          type: array
          nullable: true
          items:
            type: string
    ClientMcpServer:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
          maxLength: 100
          description: Shown to the model; names the server's tools (mcpc__<slug>__<tool>)
        url:
          type: string
          maxLength: 2048
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
          description: For example the user's Authorization header
        expiresInSeconds:
          type: integer
          format: int32
          description: Default a day, at most a week
    ThreadMcpServer:
      type: object
      required: [name, slug, url, expiresAt]
      properties:
        name:
          type: string
        slug:
          type: string
        url:
          type: string
        expiresAt:
          type: string
          format: date-time
    UsageRow:
      type: object
      required: [requests, inputTokens, outputTokens, cacheReadTokens, cacheWriteTokens, costUsd, unpricedRequests, managed]
      properties:
        day:
          type: string
          format: date
          nullable: true
        modelId:
          type: string
          format: uuid
          nullable: true
          description: Absent when grouped by model - the platform's default model
        modelName:
          type: string
          nullable: true
        providerName:
          type: string
          nullable: true
        agentId:
          type: string
          format: uuid
          nullable: true
          description: Absent when grouped by agent - a deleted agent, or service-managed agents summed
        agentName:
          type: string
          nullable: true
        managed:
          type: boolean
          description: Service-managed agents (one per app user)
        teamId:
          type: string
          format: uuid
          nullable: true
        teamSlug:
          type: string
          nullable: true
        teamName:
          type: string
          nullable: true
        requests:
          type: integer
          format: int64
        inputTokens:
          type: integer
          format: int64
        outputTokens:
          type: integer
          format: int64
        cacheReadTokens:
          type: integer
          format: int64
        cacheWriteTokens:
          type: integer
          format: int64
        costUsd:
          type: number
          format: double
          description: Estimated from the models' current prices
        unpricedRequests:
          type: integer
          format: int64
          description: Requests of models without prices (not in costUsd)
    UsageReport:
      type: object
      required: [from, to, groupBy, rows, total]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        groupBy:
          type: string
          enum: [day, model, agent, team]
        rows:
          type: array
          items:
            $ref: '#/components/schemas/UsageRow'
        total:
          $ref: '#/components/schemas/UsageRow'
    ProviderType:
      type: object
      required: [id, name, api, authHeader]
      properties:
        id:
          type: string
          enum: [openai, anthropic, openai-compatible, openai-responses, anthropic-compatible]
        name:
          type: string
        api:
          type: string
          description: The API agents speak to it (openai-responses, anthropic-messages, openai-completions)
        defaultBaseUrl:
          type: string
          nullable: true
        authHeader:
          type: string
          enum: [authorization, x-api-key]
    ModelProvider:
      type: object
      required: [id, name, kind, baseUrl, accessMode, enabled, hasHeaders, modelCount, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
