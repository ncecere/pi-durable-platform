---
# The platform pods: web traffic from the ingress peers, the gateway port from
# agents only; egress to DNS, PostgreSQL, the agents (port 4100) and public
# HTTPS (identity provider, model providers, MCP servers). The Kubernetes API
# has its own policy. Only the platform pods are selected: other pods in the
# namespace (PostgreSQL) keep their own policies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pi-durable-platform-ingress-web
  namespace: pi-durable-platform
  labels:
    app.kubernetes.io/name: pi-durable-platform
    app.kubernetes.io/instance: pi-durable-platform
    app.kubernetes.io/version: "0.2.0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pi-durable-platform
      app.kubernetes.io/instance: pi-durable-platform
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - { protocol: TCP, port: 8098 }
---
# Agents reach the platform's gateway (the model proxy) and nothing else of it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pi-durable-platform-ingress-gateway
  namespace: pi-durable-platform
  labels:
    app.kubernetes.io/name: pi-durable-platform
    app.kubernetes.io/instance: pi-durable-platform
    app.kubernetes.io/version: "0.2.0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pi-durable-platform
      app.kubernetes.io/instance: pi-durable-platform
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pi-durable-agents
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pi-durable-agent
      ports:
        - { protocol: TCP, port: 8099 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pi-durable-platform-egress
  namespace: pi-durable-platform
  labels:
    app.kubernetes.io/name: pi-durable-platform
    app.kubernetes.io/instance: pi-durable-platform
    app.kubernetes.io/version: "0.2.0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pi-durable-platform
