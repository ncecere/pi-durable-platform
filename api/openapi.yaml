    AgentTemplateUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        archived:
          type: boolean
    AgentTemplateVersion:
      type: object
      required: [version, instructions, notes, createdAt]
      properties:
        version:
          type: integer
          format: int32
        instructions:
          type: string
        notes:
          type: string
        createdByName:
          type: string
          nullable: true
        modelId:
          type: string
          format: uuid
          nullable: true
          description: Its model (absent - the platform's default)
        modelName:
          type: string
          nullable: true
        modelProviderName:
          type: string
          nullable: true
        mcp:
          type: array
          items:
            $ref: '#/components/schemas/McpAttached'
        clientMcp:
