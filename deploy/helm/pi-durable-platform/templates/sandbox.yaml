{{- if eq .Values.agents.launcher "agent-sandbox" }}
{{- if include "pdp.warmPool" . }}
# Agent Sandbox warm pool: standby agent runtimes, started and Ready before any
# agent needs one. Waking an agent claims one (SandboxClaim agent-<id>) and the
# platform activates it as that agent (POST /activate with the pool's token);
# hibernating releases the claim and the pool starts a replacement. The pods are
# the same hardened runtime the kubernetes launcher starts.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: {{ .Values.agentSandbox.templateName }}
  namespace: {{ .Values.agents.namespace }}
  labels:
    {{- include "pdp.labels" . | nindent 4 }}
spec:
  # Our own policies (networkpolicy-agents.yaml); the controller's default allows internet egress.
  networkPolicyManagement: Unmanaged
  envVarsInjectionPolicy: Disallowed
  volumeClaimTemplatesPolicy: Disallowed
  service: false
  podTemplate:
    metadata:
      labels:
        {{- include "pdp.agentPodLabels" . | nindent 8 }}
        app.kubernetes.io/component: runtime
        app.kubernetes.io/managed-by: pi-durable-platform
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      {{- with .Values.agents.runtimeClass }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.agents.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: runtime
          image: {{ include "pdp.runtimeImage" . | quote }}
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: PORT, value: "4100" }
            - name: RUNTIME_ACTIVATION_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Values.agentSandbox.activationSecret }}, key: RUNTIME_ACTIVATION_TOKEN }
          ports:
            - { name: http, containerPort: 4100 }
          readinessProbe:
            httpGet: { path: /healthz, port: 4100 }
            periodSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.agentSandbox.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: {{ .Values.agentSandbox.warmPool.name }}
  namespace: {{ .Values.agents.namespace }}
  labels:
    {{- include "pdp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.agentSandbox.warmPool.size }}
  sandboxTemplateRef:
    name: {{ .Values.agentSandbox.templateName }}
  # A new runtime image replaces the standby runtimes at once (claimed ones
  # keep running until their agent hibernates).
  updateStrategy:
    type: Recreate
{{- end }}
{{- end }}
