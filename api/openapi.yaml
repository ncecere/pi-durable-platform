          enum: [openai, anthropic, openai-compatible, openai-responses, anthropic-compatible]
        baseUrl:
          type: string
        accessMode:
          type: string
          enum: [proxy, direct]
          description: 'proxy: agents call the platform, which adds the key and counts usage; direct: agents get the URL and key'
        enabled:
          type: boolean
        hasHeaders:
          type: boolean
          description: Whether extra headers are set (their values are never returned)
        modelCount:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ModelProviderCreate:
      type: object
      required: [name, kind, apiKey]
      properties:
        name:
          type: string
          maxLength: 100
        kind:
          type: string
          enum: [openai, anthropic, openai-compatible, openai-responses, anthropic-compatible]
        baseUrl:
          type: string
          maxLength: 2048
          description: 'Default for openai and anthropic; required otherwise (for example https://litellm.example.com/v1)'
        apiKey:
          type: string
          maxLength: 4096
          writeOnly: true
        accessMode:
          type: string
          enum: [proxy, direct]
          description: Default proxy
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
          description: Extra headers sent with every request (at most 20)
        enabled:
          type: boolean
    ModelProviderUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        baseUrl:
          type: string
          maxLength: 2048
        apiKey:
          type: string
          maxLength: 4096
          writeOnly: true
          description: Replaces the key
        accessMode:
          type: string
          enum: [proxy, direct]
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
          description: Replaces every extra header ({} removes them)
        enabled:
          type: boolean
    DiscoveredModel:
      type: object
      required: [id, name, added]
      properties:
        id:
          type: string
          description: The provider's model ID
        name:
          type: string
        contextWindow:
          type: integer
          format: int32
          nullable: true
        added:
          type: boolean
          description: Whether the catalog already has it
    ModelTeam:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    Model:
      type: object
      required: [id, providerId, providerName, providerKind, upstreamId, name, contextWindow, maxTokens, images, reasoning, enabled, visibility, personal, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        providerName:
          type: string
        providerKind:
          type: string
        providerEnabled:
          type: boolean
          nullable: true
        accessMode:
          type: string
          nullable: true
          enum: [proxy, direct]
        upstreamId:
          type: string
          description: The provider's ID for the model
        name:
          type: string
        contextWindow:
          type: integer
          format: int32
        maxTokens:
          type: integer
          format: int32
        images:
          type: boolean
          description: Accepts images
        reasoning:
          type: boolean
        inputPrice:
          type: number
          format: double
          nullable: true
          description: USD per million input tokens
        outputPrice:
          type: number
          format: double
          nullable: true
          description: USD per million output tokens
        enabled:
          type: boolean
        visibility:
          type: string
          enum: [all, teams]
          description: 'all: every team may use it; teams: the listed teams'
        personal:
          type: boolean
          description: Available in personal workspaces (when created, defaults to visibility = all)
        teams:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ModelTeam'
        revision:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ModelCreate:
      type: object
      required: [upstreamId]
      properties:
        upstreamId:
          type: string
          maxLength: 200
        name:
          type: string
          maxLength: 100
          description: Defaults to upstreamId
        contextWindow:
          type: integer
          format: int32
          description: Default 128000
        maxTokens:
          type: integer
          format: int32
          description: Default 16000
        images:
          type: boolean
        reasoning:
          type: boolean
        inputPrice:
          type: number
          format: double
        outputPrice:
          type: number
          format: double
        enabled:
          type: boolean
        visibility:
          type: string
          enum: [all, teams]
        personal:
          type: boolean
          description: Available in personal workspaces (when created, defaults to visibility = all)
        teams:
          type: array
          items:
            type: string
          description: Team slugs or IDs (visibility teams)
    ModelUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        contextWindow:
          type: integer
          format: int32
        maxTokens:
          type: integer
          format: int32
        images:
          type: boolean
        reasoning:
          type: boolean
        inputPrice:
          type: number
          format: double
          description: A negative value clears it
        outputPrice:
          type: number
          format: double
          description: A negative value clears it
        enabled:
          type: boolean
        visibility:
          type: string
          enum: [all, teams]
        personal:
          type: boolean
          description: Available in personal workspaces (when created, defaults to visibility = all)
        teams:
          type: array
          items:
            type: string
          description: Replaces the teams (visibility teams)
    AgentModel:
      type: object
      required: [id, name, providerName, source, available]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        providerName:
          type: string
        source:
          type: string
          enum: [agent, template]
          description: 'agent: chosen for this agent; template: its template version''s'
        available:
          type: boolean
          description: False when the model was disabled or unpublished; the agent does not start until moved to another
    AgentTemplate:
      type: object
      required: [id, slug, name, description, status, archived, currentVersion, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: assistant
        name:
          type: string
        description:
          type: string
        teamId:
          type: string
          format: uuid
          nullable: true
          description: The owning team; absent for platform templates
        teamSlug:
          type: string
          nullable: true
        teamName:
          type: string
          nullable: true
        status:
          type: string
          enum: [private, pending, published]
          description: 'private: the team only; pending: waiting for a platform admin; published: in the catalog'
        reviewNote:
          type: string
          nullable: true
          description: Why the last request to publish was rejected
        archived:
          type: boolean
        currentVersion:
          type: integer
          format: int32
        agentCount:
          type: integer
          format: int64
          nullable: true
          description: How many agents use it (one template's view only)
        revision:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AgentTemplateCreate:
      type: object
      required: [slug, name, instructions]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$'
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        instructions:
          type: string
          maxLength: 20000
          description: The agent's system prompt (version 1)
        notes:
          type: string
          maxLength: 2000
        modelId:
          type: string
          format: uuid
          description: The model version 1 runs on (default the platform's default model)
        mcp:
          type: array
          items:
            $ref: '#/components/schemas/McpAttach'
          description: MCP servers its agents get
        clientMcp:
          type: boolean
          description: Let apps give its agents MCP servers for a thread
    AgentTemplateUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        archived:
          type: boolean
    AgentTemplateVersion:
      type: object
      required: [version, instructions, notes, createdAt]
      properties:
        version:
          type: integer
          format: int32
        instructions:
          type: string
        notes:
          type: string
        createdByName:
          type: string
          nullable: true
        modelId:
          type: string
          format: uuid
          nullable: true
          description: Its model (absent - the platform's default)
        modelName:
          type: string
          nullable: true
        modelProviderName:
          type: string
          nullable: true
        mcp:
          type: array
          items:
            $ref: '#/components/schemas/McpAttached'
        clientMcp:
          type: boolean
        createdAt:
          type: string
          format: date-time
    AgentTemplateVersionCreate:
      type: object
      required: [instructions]
      properties:
        instructions:
          type: string
          maxLength: 20000
        notes:
          type: string
          maxLength: 2000
          description: What changed
        modelId:
          type: string
          description: The model it runs on (a model's ID; "" for the platform's default; omitted keeps the current version's)
        mcp:
          type: array
          items:
            $ref: '#/components/schemas/McpAttach'
          description: MCP servers its agents get (omitted keeps the current version's; [] none)
        clientMcp:
          type: boolean
          description: Let apps give its agents MCP servers for a thread (omitted keeps the current version's)
    AgentTemplateReview:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        note:
          type: string
          maxLength: 2000
          description: Shown to the team when rejected
    Agent:
      type: object
      required: [id, name, description, teamId, teamSlug, teamName, templateId, templateSlug, templateName, templateVersion, templateCurrentVersion, enabled, running, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        teamId:
          type: string
          format: uuid
        teamSlug:
          type: string
        teamName:
          type: string
        templateId:
          type: string
          format: uuid
        templateSlug:
          type: string
        templateName:
          type: string
        templateVersion:
          type: integer
          format: int32
          description: The template version the agent runs
        templateCurrentVersion:
          type: integer
          format: int32
          description: The template's newest version (an upgrade is available when it is higher)
        externalKey:
          type: string
          nullable: true
          description: Set for service-managed agents (created by a service account with its own key)
        enabled:
          type: boolean
        running:
          type: boolean
          description: Whether its runtime is up now (it hibernates when idle and wakes on the next request)
        model:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AgentModel'
          description: The model it runs on (absent - the platform's default model)
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revision:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AgentCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        template:
          type: string
          description: A platform template's slug (default assistant), when templateId is not given
        templateId:
          type: string
          format: uuid
          description: The template (from the catalog, or the team's own)
        modelId:
          type: string
          format: uuid
          description: A model published to the team (default the template's)
    AgentEnsure:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: Defaults to the external key
        description:
          type: string
          maxLength: 2000
        template:
          type: string
          description: A platform template's slug (default assistant), when templateId is not given
        templateId:
          type: string
          format: uuid
        modelId:
          type: string
          format: uuid
          description: For a new agent, a model published to the team (default the template's)
    AgentUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        enabled:
          type: boolean
        templateVersion:
          type: integer
          format: int32
          description: Move to another version of the template (upgrade or roll back); applies when the agent next starts
        modelId:
          type: string
          description: A model published to the team, or "" for its template's; applies when the agent next starts
    AgentThread:
      type: object
      required: [threadId, title, createdAt, updatedAt, busy]
      properties:
        threadId:
          type: string
        title:
          type: string
        createdAt:
          type: integer
          format: int64
          description: Unix milliseconds
        updatedAt:
          type: integer
          format: int64
          description: Unix milliseconds; moves when a message is sent and when a reply finishes
        busy:
          type: boolean
          description: A reply is in progress
        lastReplyAt:
          type: integer
          format: int64
          nullable: true
          description: When the last reply finished (Unix milliseconds)
        lastError:
          type: string
          nullable: true
          description: Why the last reply failed (absent when it succeeded)
    AgentThreadUpdate:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
    AgentThreadEvent:
      type: object
      required: [agentId, threadId, deleted]
      properties:
        agentId:
          type: string
          format: uuid
        threadId:
          type: string
        deleted:
          type: boolean
        thread:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AgentThread'
          description: The thread now (absent when deleted)
    AgentMessageCreate:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 32000
        requestId:
          type: string
          description: Idempotency key; a repeated one is not submitted again
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        mcpServers:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ClientMcpServer'
          description: >-
            The MCP servers this thread's user enabled in the app (replaces the thread's; [] removes them). For template
            versions with clientMcp, on hosts the platform allows. Never forwarded to the agent: the platform keeps them.
    AgentMessageAccepted:
      type: object
      required: [submissionId]
      properties:
        submissionId:
          type: integer
          format: int64
    ChatToolCall:
      type: object
      required: [id, name, arguments]
      properties:
        id:
          type: string
        name:
          type: string
        arguments:
          type: object
          additionalProperties: true
    ChatMessage:
      type: object
      required: [id, role]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant, tool]
        text:
          type: string
        thinking:
          type: string
        toolCalls:
          type: array
          items:
            $ref: '#/components/schemas/ChatToolCall'
        error:
          type: string
          description: An assistant reply that failed or was interrupted
        toolCallId:
          type: string
        name:
          type: string
          description: Tool name (tool results)
        isError:
          type: boolean
    ChatToolSlot:
      type: object
      required: [callId, name, status]
      properties:
        callId:
          type: string
        name:
          type: string
        status:
          type: string
        output:
          type: string
    ChatView:
      type: object
      required: [busy, messages, tools]
      properties:
        busy:
          type: boolean
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        partial:
          type: object
          required: [text, thinking]
          description: The assistant reply being generated
          properties:
            text:
              type: string
            thinking:
              type: string
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ChatToolSlot'
    AuditActor:
      type: object
      description: Who made the change, resolved when the log is read
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - user
          - api_key
          - service_account
          - oauth
          - system
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
        apiKeyName:
          type: string
          description: The API key used (api_key actors)
        oauthClient:
          type: string
          description: The connected app the person acted through (oauth actors)
    AuditEntry:
      type: object
      required:
      - id
      - occurredAt
      - actorKind
      - actor
      - action
      - targetType
      - targetId
      - targetLabel
      - targetExists
      - metadata
      - requestId
      properties:
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        actorKind:
          type: string
          enum:
          - user
          - api_key
          - oauth
          - system
        actorUserId:
          type: string
          format: uuid
          nullable: true
        teamId:
          type: string
          format: uuid
          nullable: true
        teamName:
          type: string
          nullable: true
          description: The team's name for a team's entry (null for platform entries, or when the team was deleted)
        teamSlug:
          type: string
          nullable: true
          description: The team's slug, with teamName
        action:
          type: string
          example: team.member_add
        actor:
          $ref: '#/components/schemas/AuditActor'
        targetType:
          type: string
        targetId:
          type: string
        targetLabel:
          type: string
          nullable: true
          description: The target's current name, resolved when the log is read. For a deleted target, the last name recorded
            in the audit log; null when none is known.
        targetExists:
          type: boolean
          description: Whether the target still exists (deleted and soft-deleted targets are false)
        before:
          description: Configuration before the change
          nullable: true
        after:
          description: Configuration after the change
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        requestId:
          type: string
        via:
          allOf:
          - $ref: '#/components/schemas/AuditVia'
          nullable: true
          description: How the person acted. Null for the systems entries.
        clientIp:
          type: string
          nullable: true
          description: The caller's address as recorded, in the platform log only (null in a team's log, or when none was
            recorded).
    AuditPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        nextCursor:
          type: string
          nullable: true
    AuditVia:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - session
          - api_key
          - oauth
          description: 'session: signed in to the web app; api_key: with an API key; oauth: through an app the person
            connected.'
        name:
          type: string
          description: The API key's or the app's name, when known
    AuthConfig:
      type: object
      required:
      - oidcEnabled
