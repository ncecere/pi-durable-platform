    - $ref: '#/components/parameters/ThreadIdParam'
    get:
      tags:
      - mcp
      operationId: getThreadMcpServers
      summary: The MCP servers an app gave this thread (without headers)
      responses:
        '200':
          description: Servers that have not expired
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ThreadMcpServer'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
    put:
      tags:
      - mcp
      operationId: setThreadMcpServers
      summary: Give the thread the MCP servers its user enabled in the app (replaces them; [] removes them)
      description: >-
        For template versions with clientMcp, on hosts the platform allows (AGENTS_CLIENT_MCP_HOSTS). Headers, such
        as the user's token, are stored encrypted until the server expires (default a day). The same list can be sent
        with a message as mcpServers. Servers belong to a thread whose creator is known: setting servers on a thread ID
        the platform has no record of starts the thread (the caller is its creator, with the `visibility` sent here,
        default shared), exactly as its first message would. A thread that exists must be one the caller may reach:
        another person's private thread is 404 thread_not_found, and a `visibility` that differs from the thread's is
        409 visibility_fixed. The servers go with the thread when it is deleted. An empty list on an unknown thread
        changes nothing. A thread nobody has sent to yet (reserved) is its creator's: anyone else setting or clearing
        its servers gets 404 thread_not_found, and the first message from someone other than the creator drops the
        servers the creator set (they are not active for that sender's turn) and ends the reservation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [servers]
              properties:
                servers:
                  type: array
                  maxItems: 10
                  items:
                    $ref: '#/components/schemas/ClientMcpServer'
                visibility:
                  allOf:
                  - $ref: '#/components/schemas/ThreadVisibility'
                  description: >-
                    Only used when this call starts the thread (default shared). Send it before the first message when
                    the thread is to be private.
      responses:
        '200':
          description: Servers of the thread
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ThreadMcpServer'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
