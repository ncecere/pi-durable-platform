        oauth.client_secret_delete, reason untrusted), so they stop at once and trusting the app again needs new
        secrets. A secret survives only if its app is trusted before and after the change.
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustedClientsUpdate'
