            $ref: '#/components/schemas/TrustedClient'
    AppThreadEvent:
      type: object
      description: >-
        A thread change on the app-level event stream, for the people (subjects) who may see it, by the rules of their
        own GET /v1/agents/events through the app. People are named only by the app's subjects (AppThread).
      required: [subjects, agentId, threadId, deleted]
      properties:
        subjects:
          type: array
          description: The app-stable subjects of the people who connected the app and may see this change
          items:
            type: string
            format: uuid
        agentId:
          type: string
          format: uuid
        threadId:
          type: string
        deleted:
          type: boolean
        thread:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AppThread'
          description: The thread now (absent when deleted)
    AppThread:
      type: object
      description: >-
        A thread as the app-level event stream shows it: an AgentThread whose people are named only by the app's
        subjects, never by platform user ID, email or name. A person with an active connection to the app appears with
        their subject; anyone else (a person who didn't connect the app, or whose connection ended, and service
        accounts) appears with no identifier, so the app sees that someone else started or sent to the thread, and
        when, but not who.
      required: [threadId, title, createdAt, updatedAt, busy, visibility, participants]
      properties:
        threadId:
          type: string
        title:
          type: string
        createdAt:
          type: integer
          format: int64
          description: Unix milliseconds
        updatedAt:
          type: integer
          format: int64
          description: Unix milliseconds; moves when a message is sent and when a reply finishes
        busy:
          type: boolean
          description: A reply is in progress
        lastReplyAt:
          type: integer
          format: int64
          nullable: true
          description: When the last reply finished (Unix milliseconds)
        lastError:
          type: string
          nullable: true
          description: Why the last reply failed (absent when it succeeded)
        visibility:
          $ref: '#/components/schemas/ThreadVisibility'
        createdBy:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AppThreadPerson'
          description: Who started the thread (absent when unknown)
        participants:
          type: array
          description: Everyone who has sent to the thread, first sender first
          items:
            $ref: '#/components/schemas/AppThreadParticipant'
    AppThreadPerson:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [user, service_account]
        subject:
          type: string
          format: uuid
          nullable: true
          description: >-
            The person's app-stable subject when they have an active connection to the app; absent for anyone else
    AppThreadParticipant:
      type: object
      required: [kind, lastSentAt]
      properties:
        kind:
          type: string
          enum: [user, service_account]
        subject:
          type: string
          format: uuid
          nullable: true
          description: >-
            The person's app-stable subject when they have an active connection to the app; absent for anyone else
        lastSentAt:
          type: integer
          format: int64
          description: When they last sent to the thread (Unix milliseconds)
    AppUsageRow:
      type: object
      required: [day, subject, requests, inputTokens, outputTokens, cacheReadTokens, cacheWriteTokens, costUsd, unpricedRequests, toolCalls]
      properties:
        day:
          type: string
          format: date
        subject:
          type: string
          format: uuid
          description: The person's app-stable subject
        requests:
          type: integer
          format: int64
          description: Model requests
        inputTokens:
          type: integer
          format: int64
        outputTokens:
          type: integer
          format: int64
        cacheReadTokens:
          type: integer
          format: int64
        cacheWriteTokens:
          type: integer
          format: int64
        costUsd:
          type: number
          format: double
          description: Estimate at the models' current prices
        unpricedRequests:
          type: integer
          format: int64
          description: Requests of models without prices (not in costUsd)
        toolCalls:
          type: integer
          format: int64
          description: Tool calls through the platform's MCP proxy
    AppUsagePage:
      type: object
      required: [from, to, rows]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AppUsageRow'
        nextCursor:
          type: string
          description: Pass as cursor for the next page (absent on the last one)
    ConnectedApp:
      type: object
      description: An app people have connected (active connections)
      required: [clientId, name, kind, people, lastActiveAt, trusted]
      properties:
        clientId:
          type: string
        name:
          type: string
          description: Its name as the newest consent saw it
        kind:
          type: string
          enum:
          - metadata
          - registered
        people:
          type: integer
          format: int64
          description: People with an active connection
        lastActiveAt:
          type: string
          format: date-time
          description: Its latest use (else connection)
        trusted:
          type: boolean
    AppSecret:
      type: object
      description: A trusted app's secret, without the secret
      required: [id, clientId, prefix, createdAt, trusted]
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
        prefix:
          type: string
          description: The secret's first characters, to tell it apart
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        trusted:
          type: boolean
          description: >-
            Its app is on the trusted list now (the secret works only then; removing an app from the list deletes its
            secrets)
    AppSecretCreated:
      allOf:
      - $ref: '#/components/schemas/AppSecret'
      - type: object
        required: [secret]
        properties:
          secret:
            type: string
            description: The secret (pdpcs_…), shown this once
    AppSecretCreate:
      type: object
      required: [clientId]
      properties:
        clientId:
          type: string
          maxLength: 500
          description: A trusted app's client_id
