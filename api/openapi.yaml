  /v1/teams/{team}/usage:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    get:
      tags:
      - models
      operationId: getTeamUsage
      summary: The team's model usage, with a cost estimate (its members and service accounts, platform staff)
      description: >-
        Requests and tokens per day, model, agent, or agent and day (`agent,day`: one row per agent per day, sorted by
        agent name, then agent ID, then day; summed service-managed agents and deleted agents come last), from the
        platform's model proxy and from agents (direct-mode providers and the platform's default model). Cost uses the
        models' current prices. Service-managed agents are named for the team's owners and admins and its service
        accounts; others see them summed. `agentId` (repeatable, up to 100) narrows the report to those agents: an ID
        that is not one of the team's agents the caller may see (another team's, a deleted or unknown agent, or a
        service-managed agent for a caller who sees them summed) matches nothing, so the report never shows another
        team's usage nor reveals whether such an agent exists.
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
        description: First day (UTC), default 29 days before `to`
      - name: to
        in: query
        schema:
          type: string
          format: date
        description: Last day (UTC, inclusive), default today
      - name: groupBy
        in: query
        schema:
          type: string
          enum: [day, model, agent, 'agent,day']
          default: day
      - name: agentId
        in: query
        style: form
        explode: true
        schema:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        description: Only these agents (repeat the parameter for several, at most 100)
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UsageReport'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
