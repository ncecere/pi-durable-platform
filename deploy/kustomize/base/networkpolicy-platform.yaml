            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pi-durable-platform
          podSelector:
            matchLabels:
              cnpg.io/cluster: pdp-db
      ports:
        - { protocol: TCP, port: 5432 }
