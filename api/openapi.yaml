    put:
      tags:
      - oauth
      - admin
      operationId: adminUpdateTrustedClients
      summary: Replace the trusted apps (platform admins)
      description: >-
        Only apps identified by a Client ID Metadata Document (an https URL with a path) can be trusted: a registered
        app's ID changes, and anyone can register any name. A trusted app skips the consent screen, never the sign-in
        (nor the login_hint account check). Only a trusted app can have app secrets (GET /v1/app/events and
