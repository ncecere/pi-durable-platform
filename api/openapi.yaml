          maxLength: 100
        description:
          type: string
          maxLength: 2000
        instructions:
          type: string
          maxLength: 20000
          description: The agent's system prompt (version 1)
        notes:
          type: string
          maxLength: 2000
        modelId:
          type: string
          format: uuid
          description: The model version 1 runs on (default the platform's default model)
        mcp:
          type: array
          items:
            $ref: '#/components/schemas/McpAttach'
