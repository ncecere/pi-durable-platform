    ServiceAccountKeyCreated:
      type: object
      required:
      - key
      - secret
      properties:
        key:
          $ref: '#/components/schemas/ServiceAccountKey'
        secret:
          type: string
          description: The full key, shown only now
    ConnectInfo:
      type: object
      description: OAuth Connect, for apps that act as the people who connect them (see DESIGN.md)
      required:
      - issuer
      - authorizationEndpoint
      - tokenEndpoint
      - revocationEndpoint
      - registrationEndpoint
      - scopes
      properties:
        issuer:
          type: string
        authorizationEndpoint:
          type: string
        tokenEndpoint:
          type: string
        revocationEndpoint:
          type: string
        registrationEndpoint:
          type: string
        scopes:
          type: array
          items:
            type: string
    OAuthClientInfo:
      type: object
      description: An app, as it identifies itself
      required:
      - id
      - kind
      - name
      - host
      - trusted
      properties:
        id:
          type: string
          description: Its client_id
        kind:
          type: string
          enum:
          - metadata
          - registered
          description: >-
            metadata: identified by a Client ID Metadata Document, whose host vouches for it; registered: it registered
            itself, so its name is unverified.
        name:
          type: string
        host:
          type: string
          description: The metadata document's host, or a registered app's (unverified) home page host
        uri:
          type: string
          description: Its home page (https)
        logoUrl:
          type: string
          description: >-
            The logo it published (https; present when it published one). Don't load it from the browser: show it with
            GET /v1/oauth/client-logo?client_id=<id>, which the platform serves from its own origin.
        trusted:
          type: boolean
          description: On the platform's trusted list (skips the consent screen)
    PersonalWorkspaceRef:
      type: object
      required:
      - slug
      - name
      properties:
        slug:
          type: string
        name:
          type: string
    OAuthConsent:
      type: object
      required:
      - client
      - redirectUri
      - redirectHost
      - scopes
      - remembered
      properties:
        client:
          $ref: '#/components/schemas/OAuthClientInfo'
        redirectUri:
          type: string
        redirectHost:
          type: string
        scopes:
          type: array
          items:
            type: string
        remembered:
          type: boolean
          description: The person already allowed this app
        personalWorkspace:
          $ref: '#/components/schemas/PersonalWorkspaceRef'
    OAuthConsentDecision:
      type: object
      required:
      - query
      - decision
      properties:
        query:
          type: string
          maxLength: 8000
          description: The authorization request's query string, as the consent page received it
        decision:
          type: string
          enum:
          - allow
          - deny
    OAuthConsentResult:
      type: object
      required:
      - redirectUrl
      properties:
        redirectUrl:
          type: string
          description: The app's redirect URI with a code, or with error=access_denied
    OAuthGrant:
      type: object
      description: A connected app
      required:
      - id
      - client
      - scopes
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        client:
          $ref: '#/components/schemas/OAuthClientInfo'
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
    TrustedClient:
      type: object
      required:
      - clientId
      properties:
        clientId:
          type: string
          maxLength: 500
          description: The https URL of the app's Client ID Metadata Document
        label:
          type: string
          maxLength: 100
    TrustedClients:
      type: object
      required:
      - clients
      - revision
      - updatedAt
      properties:
        clients:
          type: array
          items:
            $ref: '#/components/schemas/TrustedClient'
        revision:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    TrustedClientsUpdate:
      type: object
      required:
      - clients
      properties:
        clients:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/TrustedClient'
