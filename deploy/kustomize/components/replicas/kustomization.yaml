# Two platform replicas (change `replicas` for more): rolling updates one pod
# at a time with none missing (maxUnavailable 0), spread over nodes and zones
# (preferred, never blocking). Replicas share everything through PostgreSQL
# (docs/replicas.md). Use it with components/pod-disruption-budget, so that a
# node drain evicts one replica at a time.
#
# Hand-written; deploy/scripts/check-parity.sh checks it against the chart
# (examples/production renders both with replicaCount 2).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: { kind: Deployment, name: pi-durable-platform }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pi-durable-platform
      spec:
        replicas: 2
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
        template:
          spec:
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: pi-durable-platform
                          app.kubernetes.io/instance: pi-durable-platform
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: ScheduleAnyway
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: pi-durable-platform
                    app.kubernetes.io/instance: pi-durable-platform
