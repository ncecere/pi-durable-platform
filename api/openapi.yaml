          $ref: '#/components/schemas/TeamRole'
    MemberAddResult:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - added
          - invited
        member:
          $ref: '#/components/schemas/Member'
        invite:
          $ref: '#/components/schemas/Invite'
    MemberUpdate:
      type: object
      required:
      - role
