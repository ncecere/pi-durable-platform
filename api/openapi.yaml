        createdAt:
          type: string
          format: date-time
    AgentTemplateVersionCreate:
      type: object
      required: [instructions]
      properties:
        instructions:
          type: string
          maxLength: 20000
        notes:
          type: string
          maxLength: 2000
          description: What changed
        modelId:
          type: string
          description: The model it runs on (a model's ID; "" for the platform's default; omitted keeps the current version's)
        mcp:
          type: array
          items:
            $ref: '#/components/schemas/McpAttach'
          description: MCP servers its agents get (omitted keeps the current version's; [] none)
        clientMcp:
          type: boolean
          description: Let apps give its agents MCP servers for a thread (omitted keeps the current version's)
    AgentTemplateReview:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        note:
          type: string
          maxLength: 2000
          description: Shown to the team when rejected
    Agent:
      type: object
      required: [id, name, description, teamId, teamSlug, teamName, templateId, templateSlug, templateName, templateVersion, templateCurrentVersion, serviceManaged, enabled, running, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        teamId:
          type: string
          format: uuid
        teamSlug:
          type: string
        teamName:
          type: string
        templateId:
          type: string
          format: uuid
        templateSlug:
          type: string
        templateName:
          type: string
        templateVersion:
          type: integer
          format: int32
          description: The template version the agent runs
        templateCurrentVersion:
          type: integer
          format: int32
          description: The template's newest version (an upgrade is available when it is higher)
        externalKey:
          type: string
          nullable: true
          description: The key it was ensured with (PUT .../agents/by-key/{key}), if any
        serviceManaged:
          type: boolean
          description: >-
            An app's agent for one of its users (made by a service account with an external key, in a shared team):
            only the team's service accounts use it. An agent with a key in a personal workspace is not.
        enabled:
          type: boolean
        running:
          type: boolean
          description: Whether its runtime is up now (it hibernates when idle and wakes on the next request)
        model:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AgentModel'
          description: The model it runs on (absent - the platform's default model)
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revision:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AgentCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        template:
          type: string
          description: A platform template's slug (default assistant), when templateId is not given
        templateId:
          type: string
          format: uuid
          description: The template (from the catalog, or the team's own)
        modelId:
          type: string
          format: uuid
          description: A model published to the team (default the template's)
    AgentEnsure:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: Defaults to the external key
        description:
          type: string
          maxLength: 2000
        template:
          type: string
          description: A platform template's slug (default assistant), when templateId is not given
        templateId:
          type: string
          format: uuid
        modelId:
          type: string
          format: uuid
          description: For a new agent, a model published to the team (default the template's)
    AgentMove:
      type: object
      required: [team]
      properties:
        team:
          type: string
          description: The target team's slug or ID
        modelId:
          type: string
          format: uuid
          description: A model to switch to as part of the move (one the target team may use); default the agent's
    AgentMoveTeam:
      type: object
      required: [id, slug, name, kind]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [team, personal]
    AgentMoveBlocker:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: The error code the move would be refused with
          example: move_template_unavailable
        message:
          type: string
    AgentMovePlan:
      type: object
      required: [agentId, from, to, allowed, blockers, sharedThreads, privateThreads, privateThreadsUnreachable, targetMembers,
        targetServiceAccounts, peopleLosingAccess, serviceAccountsLosingAccess, threadMcpServers, mcpServersDropped]
      properties:
        agentId:
          type: string
          format: uuid
        from:
          $ref: '#/components/schemas/AgentMoveTeam'
        to:
          $ref: '#/components/schemas/AgentMoveTeam'
        allowed:
          type: boolean
          description: Whether the move would be done now (no blockers)
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/AgentMoveBlocker'
        sharedThreads:
          type: integer
          format: int64
          description: Shared threads, which everyone who may use the agent in the target team will see
        privateThreads:
          type: integer
          format: int64
          description: Private threads; they stay their creator's
        privateThreadsUnreachable:
          type: integer
          format: int64
          description: Private threads whose creator can't use the agent in the target team (a service account, or a person who isn't a member)
        targetMembers:
          type: integer
          format: int64
          description: People in the target team (who may use the agent after the move)
        targetServiceAccounts:
          type: integer
          format: int64
          description: The target team's service accounts (who may use the agent after the move)
        peopleLosingAccess:
          type: integer
          format: int64
          description: People of the current team who aren't in the target team
        serviceAccountsLosingAccess:
          type: integer
          format: int64
          description: The current team's service accounts, whose keys no longer reach the agent
        externalKey:
          type: string
          nullable: true
          description: The agent's key, dropped by the move (PUT .../agents/by-key/{key} no longer finds it)
        threadMcpServers:
          type: integer
          format: int64
          description: MCP servers apps set on its threads, removed by the move
        mcpServersDropped:
          type: array
          description: Names of its template version's MCP servers that the target team may not use (they stop applying)
          items:
            type: string
        model:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AgentModel'
          description: The model it would run on in the target team (absent - the platform's default model)
    AgentUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        enabled:
          type: boolean
        templateVersion:
          type: integer
          format: int32
          description: Move to another version of the template (upgrade or roll back); applies when the agent next starts
        modelId:
          type: string
          description: A model published to the team, or "" for its template's; applies when the agent next starts
    AgentThread:
      type: object
      required: [threadId, title, createdAt, updatedAt, busy, visibility, participants]
      properties:
        threadId:
          type: string
        title:
          type: string
        createdAt:
          type: integer
          format: int64
          description: Unix milliseconds
        updatedAt:
          type: integer
          format: int64
          description: Unix milliseconds; moves when a message is sent and when a reply finishes
        busy:
          type: boolean
          description: A reply is in progress
        lastReplyAt:
          type: integer
          format: int64
          nullable: true
          description: When the last reply finished (Unix milliseconds)
        lastError:
          type: string
          nullable: true
          description: Why the last reply failed (absent when it succeeded)
        visibility:
          $ref: '#/components/schemas/ThreadVisibility'
        createdBy:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/ThreadPrincipal'
          description: Who started the thread (absent when unknown, such as threads begun before the platform recorded it)
        participants:
          type: array
          description: Everyone who has sent to the thread, first sender first
          items:
            $ref: '#/components/schemas/ThreadParticipant'
    ThreadVisibility:
      type: string
      enum: [shared, private]
      description: >-
        shared: everyone who may use the agent sees the thread. private: only the person or service account that started
        it (not other members, not the team's owners or admins). Chosen when the thread starts (createAgentThread, its
        first message, or its MCP servers being set); it never changes.
    ThreadPrincipal:
      type: object
      required: [kind, id, name]
      properties:
        kind:
          type: string
          enum: [user, service_account]
        id:
          type: string
          format: uuid
        name:
          type: string
          description: A person's display name (else email), or a service account's name
    ThreadParticipant:
      type: object
      required: [kind, id, name, lastSentAt]
      properties:
        kind:
          type: string
          enum: [user, service_account]
        id:
          type: string
          format: uuid
        name:
          type: string
        lastSentAt:
          type: integer
          format: int64
          description: When they last sent to the thread (Unix milliseconds)
    AdminAgentThread:
      type: object
      description: >-
        A thread as platform admins list it. The title of a private thread, of every thread of a personal
        workspace's agent and of every thread of a service-managed (by-key) agent is withheld (null, titleHidden):
        reading one takes a reason (adminReadAgentThread).
      required: [threadId, title, titleHidden, createdAt, updatedAt, busy, visibility, participants]
      properties:
        threadId:
          type: string
        title:
          type: string
          nullable: true
        titleHidden:
          type: boolean
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
        busy:
          type: boolean
        lastReplyAt:
          type: integer
          format: int64
          nullable: true
        lastError:
          type: string
          nullable: true
        visibility:
          $ref: '#/components/schemas/ThreadVisibility'
        createdBy:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/ThreadPrincipal'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ThreadParticipant'
    AdminThreadRead:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Why the conversation is opened; recorded in the agent's team's audit log
    AgentThreadUpdate:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
    AgentThreadCreate:
      type: object
      properties:
        visibility:
          $ref: '#/components/schemas/ThreadVisibility'
        title:
          type: string
          maxLength: 200
    AgentThreadEvent:
      type: object
      required: [agentId, threadId, deleted]
      properties:
        agentId:
          type: string
          format: uuid
        threadId:
          type: string
        deleted:
          type: boolean
        thread:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AgentThread'
          description: The thread now (absent when deleted)
    AgentMessageCreate:
      type: object
      required: [text]
      description: >-
        The platform records the thread (its creator and visibility) before relaying the first message. Another's
        private thread reads as not found (404 thread_not_found), on this and every thread route. If the thread ID
        was reserved by someone else (they set its MCP servers before any message), this message still goes through,
        but the servers they set are dropped and not active for it; send `mcpServers` to give the thread your own.
      properties:
        text:
          type: string
          maxLength: 32000
        requestId:
          type: string
          description: Idempotency key; a repeated one is not submitted again
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        mcpServers:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ClientMcpServer'
          description: >-
            The MCP servers this thread's user enabled in the app (replaces the thread's; [] removes them). For template
            versions with clientMcp, on hosts the platform allows. Never forwarded to the agent: the platform keeps them.
        visibility:
          allOf:
          - $ref: '#/components/schemas/ThreadVisibility'
          description: >-
            The thread's visibility, chosen with its first message (default shared). On a later message it may be
            omitted; a different value is refused (409 visibility_fixed). The message's author is always the caller:
            author fields a client sends are ignored.
        whenBusy:
          type: string
          enum: [followUp, steer]
          description: >-
            While a reply is running: followUp (the default) waits for it to end and starts the next one; steer joins it, placed
            after its current tool round (or its answer) so the model sees it before going on. The transcript shows a
            steering message where it was placed: after the tool results of the reply it changed. No effect on an
            idle thread.
    AgentMessageAccepted:
      type: object
      required: [submissionId]
      properties:
        submissionId:
          type: integer
          format: int64
    ChatToolCall:
      type: object
      required: [id, name, arguments]
      properties:
        id:
          type: string
        name:
          type: string
        arguments:
          type: object
          additionalProperties: true
        startedAt:
          type: integer
          format: int64
          description: When the call was made (the assistant message's time, Unix milliseconds)
        endedAt:
          type: integer
          format: int64
          description: When its result arrived (Unix milliseconds; absent while it runs)
    ChatAuthor:
      type: object
      required: [kind, id, name]
      description: Who sent a user message, as the platform recorded it
      properties:
        kind:
          type: string
          enum: [user, service_account]
        id:
          type: string
        name:
          type: string
        via:
          type: string
          description: The app a person sent it through (OAuth Connect)
    ChatModel:
      type: object
      required: [provider, id]
      properties:
        provider:
          type: string
        id:
          type: string
    ChatUsage:
      type: object
      required: [input, output, cacheRead, cacheWrite, total]
      description: Tokens of one model response
      properties:
        input:
          type: integer
          format: int64
        output:
          type: integer
          format: int64
        cacheRead:
          type: integer
          format: int64
        cacheWrite:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    ChatMessage:
      type: object
      required: [id, role]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant, tool]
        text:
          type: string
        thinking:
          type: string
        toolCalls:
          type: array
          items:
            $ref: '#/components/schemas/ChatToolCall'
        error:
          type: string
          description: An assistant reply that failed or was interrupted
        toolCallId:
          type: string
        name:
          type: string
          description: Tool name (tool results)
        isError:
          type: boolean
        author:
          $ref: '#/components/schemas/ChatAuthor'
        at:
          type: integer
          format: int64
          description: When the message was sent or the reply started (Unix milliseconds)
        model:
          $ref: '#/components/schemas/ChatModel'
        usage:
          $ref: '#/components/schemas/ChatUsage'
        stopReason:
          type: string
          description: Why an assistant reply ended (stop, length, toolUse, error, aborted)
    ChatToolSlot:
      type: object
      required: [callId, name, status]
      properties:
        callId:
          type: string
        name:
          type: string
        status:
          type: string
        output:
          type: string
    ChatView:
      type: object
      required: [busy, messages, tools]
      properties:
        busy:
          type: boolean
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        partial:
          type: object
          required: [text, thinking]
          description: The assistant reply being generated
          properties:
            text:
              type: string
            thinking:
              type: string
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ChatToolSlot'
        earlierCursor:
          type: string
          description: Paged reads only; pass it as `before` for the earlier messages (absent when there are none)
    ChatDeltaEvent:
      type: object
      required: [type, seq]
      description: >-
        One event of a thread's delta stream (`format=delta`, version 1). Which fields are set depends on `type`;
        see the stream's description.
      properties:
        type:
          type: string
          enum: [snapshot, message.added, message.updated, partial.set, partial.appended, partial.cleared, tool.started,
            tool.updated, tool.finished, tool.removed, tools.set, run]
        seq:
          type: integer
          format: int64
        v:
          type: integer
          description: The format's version (snapshot)
        view:
          $ref: '#/components/schemas/ChatView'
        message:
          $ref: '#/components/schemas/ChatMessage'
        partial:
          type: object
          required: [text, thinking]
          properties:
            text:
              type: string
            thinking:
              type: string
        text:
          type: string
          description: partial.appended
        thinking:
          type: string
          description: partial.appended
        tool:
          $ref: '#/components/schemas/ChatToolSlot'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ChatToolSlot'
        callId:
          type: string
        status:
          type: string
        output:
          type: string
          nullable: true
        outputAppended:
          type: string
        startedAt:
          type: integer
          format: int64
          description: When the tool call started (Unix milliseconds)
        elapsedMs:
          type: integer
          format: int64
          description: How long the tool call had run when the event was sent
        busy:
          type: boolean
    AuditActor:
      type: object
      description: Who made the change, resolved when the log is read
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - user
          - api_key
          - service_account
          - oauth
          - system
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
        apiKeyName:
          type: string
          description: The API key used (api_key actors)
        oauthClient:
          type: string
          description: The connected app the person acted through (oauth actors)
    AuditEntry:
      type: object
      required:
      - id
      - occurredAt
      - actorKind
      - actor
      - action
      - targetType
      - targetId
      - targetLabel
      - targetExists
      - metadata
      - requestId
      properties:
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        actorKind:
          type: string
          enum:
          - user
          - api_key
          - oauth
          - system
        actorUserId:
          type: string
          format: uuid
          nullable: true
        teamId:
          type: string
          format: uuid
          nullable: true
        teamName:
          type: string
          nullable: true
          description: The team's name for a team's entry (null for platform entries, or when the team was deleted)
        teamSlug:
          type: string
          nullable: true
          description: The team's slug, with teamName
        action:
          type: string
          example: team.member_add
        actor:
          $ref: '#/components/schemas/AuditActor'
        targetType:
          type: string
        targetId:
          type: string
        targetLabel:
          type: string
          nullable: true
          description: The target's current name, resolved when the log is read. For a deleted target, the last name recorded
            in the audit log; null when none is known.
        targetExists:
          type: boolean
          description: Whether the target still exists (deleted and soft-deleted targets are false)
        before:
          description: Configuration before the change
          nullable: true
        after:
          description: Configuration after the change
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        requestId:
          type: string
        via:
          allOf:
          - $ref: '#/components/schemas/AuditVia'
          nullable: true
          description: How the person acted. Null for the systems entries.
        clientIp:
          type: string
          nullable: true
          description: The caller's address as recorded, in the platform log only (null in a team's log, or when none was
            recorded).
    AuditPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        nextCursor:
          type: string
          nullable: true
    AuditVia:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - session
          - api_key
          - oauth
          description: 'session: signed in to the web app; api_key: with an API key; oauth: through an app the person
            connected.'
        name:
          type: string
          description: The API key's or the app's name, when known
    AuthConfig:
      type: object
      required:
      - oidcEnabled
      - devAuthEnabled
      - loginUrl
      - devAccounts
      - instance
      properties:
        instance:
          $ref: '#/components/schemas/InstanceInfo'
        oidcEnabled:
          type: boolean
        devAuthEnabled:
          type: boolean
        loginUrl:
          type: string
        devAccounts:
          type: array
          items:
            $ref: '#/components/schemas/DevAccount'
        teamRequestUrl:
          type: string
          nullable: true
          description: Where people request a new team (only platform admins create teams)
        connect:
          $ref: '#/components/schemas/ConnectInfo'
    Capabilities:
      type: object
      required:
      - platformAdmin
      - platformAuditor
      properties:
        platformAdmin:
          type: boolean
        platformAuditor:
          type: boolean
    DevAccount:
      type: object
      required:
      - id
      - name
      - email
      - platformRole
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        platformRole:
          $ref: '#/components/schemas/PlatformRole'
    DevLoginRequest:
      type: object
      required:
      - account
      properties:
        account:
          type: string
          example: admin
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              description: Structured context for some errors.
    Health:
      type: object
      required:
      - status
      - checks
      properties:
        status:
          type: string
          enum:
          - ok
          - draining
          - unavailable
        checks:
          type: object
          additionalProperties:
            type: string
    InstanceInfo:
      type: object
      description: How this deployment presents itself (INSTANCE_NAME, ORG_NAME, UI_THEME, UI_LOGO_URL, SUPPORT_URL).
      required:
      - name
      - orgName
      - theme
      - logoUrl
      - supportUrl
      properties:
        name:
          type: string
          example: Pi Durable Platform
          description: Product name shown in the UI and page titles
        orgName:
          type: string
          example: Example Corp
          description: Organisation name (empty when not configured)
        theme:
          type: string
          enum:
          - neutral
          description: UI theme, applied as data-brand on the html element
        logoUrl:
          type: string
          nullable: true
          example: https://www.example.edu/logo.svg
          description: https URL or same-origin path of the logo
        supportUrl:
          type: string
          nullable: true
          example: https://help.example.edu/ai
          description: 'Where the Help link points: an http(s) URL or a mailto: address'
    Invite:
      type: object
      required:
      - id
      - email
      - role
      - createdAt
      - expiresAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: '#/components/schemas/TeamRole'
        invitedBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Me:
      type: object
      required:
      - user
      - csrfToken
      - capabilities
      - teams
      - groups
      properties:
        teams:
          type: array
          items:
            $ref: '#/components/schemas/MyTeam'
        groups:
          type: array
          description: The caller's IdP groups as of their last sign-in (from OIDC_GROUPS_CLAIM; may be empty).
          items:
            type: string
        user:
          $ref: '#/components/schemas/User'
        csrfToken:
          type: string
        capabilities:
          $ref: '#/components/schemas/Capabilities'
    Member:
      type: object
      required:
      - user
      - role
      - revision
      - createdAt
      properties:
        user:
          $ref: '#/components/schemas/MemberUser'
        role:
          $ref: '#/components/schemas/TeamRole'
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          type: string
          format: date-time
    MemberAdd:
      type: object
      required:
      - email
      - role
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/TeamRole'
    MemberAddResult:
