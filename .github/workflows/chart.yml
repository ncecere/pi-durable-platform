# Publishes the Helm chart for v* tags: packages deploy/helm/pi-durable-platform
# with the tag's version as chart version and appVersion (v0.2.0 -> 0.2.0, so the
# chart's default images are the release's), pushes it to
#   oci://ghcr.io/ncecere/charts/pi-durable-platform
# and signs it with cosign (keyless, GitHub Actions OIDC, as image.yml signs the
# images).
#
# Independent of image.yml: it neither waits for the images nor affects them. If
# the release's images fail to build, delete the chart tag from the registry.
#
# Every action is pinned by commit SHA; the comment gives the version.
name: chart
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # On a branch (workflow_dispatch) there is nothing to publish.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (Sigstore OIDC)
    env:
      REGISTRY: ghcr.io/ncecere/charts
      CHART: pi-durable-platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'${TAG}' is not a vX.Y.Z or vX.Y.Z-pre tag"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install helm
        run: |
          deploy/scripts/install-tools.sh helm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          helm lint "deploy/helm/${CHART}" --set appUrl=https://agents.example.com \
            --set 'networkPolicy.kubeApiServer.cidrs={192.0.2.10/32}' \
            --set networkPolicy.database.podLabels.app=postgres
          helm package "deploy/helm/${CHART}" --version "${VERSION}" --app-version "${VERSION}" --destination "${RUNNER_TEMP}/chart"
          ls -l "${RUNNER_TEMP}/chart"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # helm push prints the pushed digest ("Digest: sha256:...").
      - name: Push
        id: push
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          helm push "${RUNNER_TEMP}/chart/${CHART}-${VERSION}.tgz" "oci://${REGISTRY}" 2>&1 | tee "${RUNNER_TEMP}/push.txt"
          digest=$(sed -n 's/^Digest: *//p' "${RUNNER_TEMP}/push.txt" | head -n1)
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest in the helm push output"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign (cosign keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${CHART}@${DIGEST}"

      # Check what a user would: the signature verifies against this workflow's identity.
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "${REGISTRY}/${CHART}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/chart.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null

      - name: Job summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          {
            echo "## ${REGISTRY}/${CHART}"
            echo
            echo "Install:"
            echo
            echo '```'
            echo "helm install pi-durable-platform oci://${REGISTRY}/${CHART} --version ${VERSION} -n pi-durable-platform -f values.yaml"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Verify the signature:"
            echo
            echo '```'
            echo "cosign verify ${REGISTRY}/${CHART}@${DIGEST} \\"
            echo "  --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/chart.yml@${GITHUB_REF} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
