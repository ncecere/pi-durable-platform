# The Secrets the platform reads. NOT applied by anything here: create them
# yourself (kubectl, your secrets operator, sealed secrets, ...). Every value
# below is an obviously fake placeholder; the platform refuses the repository's
# public example keys on a reachable host.
#
#   kubectl create namespace pi-durable-platform   # first, as in deploy/README.md
#   cp secrets.example.yaml secrets.yaml           # edit, keep it out of git
#   kubectl apply -f secrets.yaml
#
# The names and keys are the defaults of both the Kustomize base and the Helm
# chart (values `secrets.*` change them). Keys marked optional may be left out.
apiVersion: v1
kind: Secret
metadata:
  name: pi-durable-platform
  namespace: pi-durable-platform
type: Opaque
stringData:
  # Platform metadata database (PostgreSQL 17).
  DATABASE_URL: "postgres://pdp:CHANGE-ME@pdp-db-rw.pi-durable-platform.svc:5432/pdp?sslmode=require"
  # Agent state database: a role with CREATEROLE and CREATE on it. The host
  # must resolve from the agents namespace (service.namespace.svc); agents get
  # this host with their own role, never this one.
  AGENTS_DATABASE_URL: "postgres://pdp_agents_admin:CHANGE-ME@pdp-db-rw.pi-durable-platform.svc:5432/pdp_agents?sslmode=require"
  # 32 random bytes, base64 each, different values: `openssl rand -base64 32`.
  ENCRYPTION_KEY: "REPLACE-WITH-openssl-rand-base64-32"
  API_KEY_PEPPER: "REPLACE-WITH-another-openssl-rand-base64-32"
  # Optional: the OIDC client's secret (required when OIDC is configured).
  OIDC_CLIENT_SECRET: "REPLACE-WITH-the-identity-providers-client-secret"
  # Optional: while rotating ENCRYPTION_KEY / API_KEY_PEPPER, the old values.
  # ENCRYPTION_KEY_PREVIOUS: ""
  # API_KEY_PEPPER_PREVIOUS: ""
  # Optional: the key for AGENTS_MODEL_PROVIDER=openai-compatible.
  # AGENTS_MODEL_API_KEY: ""
