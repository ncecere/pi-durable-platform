# Cilium: the platform's Kubernetes API egress as a CiliumNetworkPolicy naming
# the kube-apiserver entity, instead of the base's NetworkPolicy with a
# placeholder CIDR.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ciliumnetworkpolicy.yaml
patches:
  - target:
      group: networking.k8s.io
      kind: NetworkPolicy
      name: pi-durable-platform-egress-kube-api
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: pi-durable-platform-egress-kube-api
