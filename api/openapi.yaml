  /v1/agents/{agentId}/threads/{threadId}/events:
    parameters:
    - $ref: '#/components/parameters/AgentIdParam'
    - $ref: '#/components/parameters/ThreadIdParam'
    get:
      tags:
      - agents
      operationId: streamAgentThread
      summary: Server-sent events with the conversation's view after every change
      description: |-
        Each `view` event's data is a ChatView (JSON), sent after every change (at most 10 a second). The stream keeps
        the agent awake while open. Access is checked again every 30 seconds: the stream ends when the caller is no
        longer active (suspended, or denied by the group re-check), may no longer use the agent, or the thread is
        another's private one.

        `format=delta` (version `v=1`, the only one) sends changes instead of whole views: a `snapshot` event first
        (a ChatView), then events for what changed, each a ChatDeltaEvent whose `type` is also the event's name and
        whose `seq` (also the event's `id`) counts up by one. Types: `message.added`, `message.updated` (replace the
        message with that id), `partial.set`, `partial.appended` (text and thinking to append to the reply in
        progress), `partial.cleared`, `tool.started`, `tool.updated` and `tool.finished` (status, `outputAppended` or
        `output`; null: none, and `details`, `detailsOmitted`), `tool.removed`, `tools.set`, `run` (`busy`), and
        `document.updated` (`kind`, `revision`: an exposed document changed; read it with getAgentThreadDocument).
        Tool events carry `startedAt` and `elapsedMs` (live metadata, not part of the view). Applying the events in order to the snapshot gives the
        view a new snapshot would; whatever can't be sent as a change (the conversation was compacted or reset) comes
        as a new snapshot. Every connection starts with a snapshot; with `Last-Event-ID` (EventSource sends it when it
        reconnects) its numbering goes on after that ID. A steering message is a `message.added` (a user message)
        after the tool results of the reply it steers, before that reply's next answer.

        `limit` keeps whole views and snapshots to the latest messages, with `earlierCursor` for the earlier ones
        (`GET` the thread with `before`); new messages are added to the window.
      parameters:
      - name: once
        in: query
        description: Send the current view (or snapshot) as one event, then end the stream
        schema:
          type: boolean
      - name: format
        in: query
        description: view (default) for whole views, delta for a snapshot and then changes
        schema:
          type: string
          enum: [view, delta]
      - name: v
        in: query
        description: The delta format's version (1); other values are 400 unsupported_version
        schema:
          type: integer
          enum: [1]
      - name: limit
        in: query
        description: Only the latest messages (1-200) in views and snapshots
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: Last-Event-ID
        in: header
        required: false
        description: The last delta event a reconnecting client applied; the new stream's numbering goes on after it
        schema:
          type: string
      responses:
        '200':
          description: An event stream
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '503':
          $ref: '#/components/responses/ErrorReply'
  /v1/oauth/consent:
    get:
      tags:
      - oauth
      operationId: getOAuthConsent
      summary: The consent page's view of an app's authorization request (the person signed in)
      description: >-
        The query is the authorization request the app sent to /oauth/authorize, unchanged (the platform redirects the
        browser to the web app's /connect/consent with it). A request that isn't valid is a 400 whose code starts with
        oauth_ (the page shows the reason and never sends the browser anywhere). When the request's login_hint isn't the
        signed-in person (their email or identity provider subject), accountMismatch is true: the page offers to sign
        out and sign in as the hinted account, or to cancel, and allowing is refused (409 account_mismatch).
      parameters:
      - name: client_id
        in: query
        required: false
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: false
        schema:
          type: string
      - name: response_type
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge_method
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: scope
        in: query
        required: false
        schema:
          type: string
      - name: resource
        in: query
        required: false
        schema:
          type: string
      - name: prompt
        in: query
        required: false
        schema:
          type: string
      - name: login_hint
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The app, where it will send the person back, and what it asks for
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/OAuthConsent'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
    post:
      tags:
      - oauth
      operationId: decideOAuthConsent
      summary: Allow or deny an app's authorization request; returns where to send the browser
      description: >-
        Allowing records the person's consent (a connected app, remembered until revoked; a grant of agents:read
        widens to agents when the app asks for it) and returns the app's redirect URI with an authorization code;
        denying returns it with error=access_denied. Allowing a request whose login_hint isn't the signed-in person is
        409 account_mismatch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
