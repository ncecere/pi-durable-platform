# Generated by deploy/scripts/generate-kustomize.sh from the Helm chart (templates/sandbox.yaml): do not edit.
---
# Agent Sandbox warm pool: standby agent runtimes, started and Ready before any
# agent needs one. Waking an agent claims one (SandboxClaim agent-<id>) and the
# platform activates it as that agent (POST /activate with the pool's token);
# hibernating releases the claim and the pool starts a replacement. The pods are
# the same hardened runtime the kubernetes launcher starts.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: pdp-runtime
  namespace: pi-durable-agents
  labels:
    app.kubernetes.io/name: pi-durable-platform
    app.kubernetes.io/instance: pi-durable-platform
    app.kubernetes.io/version: "0.1.2"
spec:
  # Our own policies (networkpolicy-agents.yaml); the controller's default allows internet egress.
  networkPolicyManagement: Unmanaged
  envVarsInjectionPolicy: Disallowed
  volumeClaimTemplatesPolicy: Disallowed
  service: false
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: pi-durable-agent
        app.kubernetes.io/component: runtime
        app.kubernetes.io/managed-by: pi-durable-platform
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: runtime
          image: "ghcr.io/ncecere/pi-durable-platform-runtime:v0.1.2"
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: PORT, value: "4100" }
            - name: RUNTIME_ACTIVATION_TOKEN
              valueFrom:
                secretKeyRef: { name: pdp-runtime-activation, key: RUNTIME_ACTIVATION_TOKEN }
          ports:
            - { name: http, containerPort: 4100 }
          readinessProbe:
            httpGet: { path: /healthz, port: 4100 }
            periodSeconds: 2
            failureThreshold: 3
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 160Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: pdp-runtimes
  namespace: pi-durable-agents
  labels:
    app.kubernetes.io/name: pi-durable-platform
    app.kubernetes.io/instance: pi-durable-platform
    app.kubernetes.io/version: "0.1.2"
spec:
  replicas: 2
  sandboxTemplateRef:
    name: pdp-runtime
  # A new runtime image replaces the standby runtimes at once (claimed ones
  # keep running until their agent hibernates).
  updateStrategy:
    type: Recreate
