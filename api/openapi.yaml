      operationId: listAgentApprovals
      summary: The agent's tool approvals the caller may see, newest first
      description: >-
        Requests to approve a tool call (docs/approvals.md) in the agent's threads the caller may read: shared threads,
        and their own private ones. Anyone who may use the agent sees them; `canDecide` says whether the caller may
        decide one.
      parameters:
      - name: thread
        in: query
        required: false
        description: One thread's only
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
      - name: status
        in: query
        required: false
        description: 'pending (default), decided (approved, denied, timed out or cancelled) or all'
        schema:
          type: string
          enum: [pending, decided, all]
      - name: limit
        in: query
        required: false
        description: At most this many (1-200, default 100)
        schema:
          type: integer
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: Approvals
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolApproval'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
