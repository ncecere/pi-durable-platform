      properties:
        id:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        providerName:
          type: string
        providerKind:
          type: string
        providerEnabled:
          type: boolean
          nullable: true
        accessMode:
          type: string
          nullable: true
          enum: [proxy, direct]
        upstreamId:
          type: string
          description: The provider's ID for the model
        name:
          type: string
        contextWindow:
          type: integer
          format: int32
        maxTokens:
          type: integer
          format: int32
        images:
          type: boolean
          description: Accepts images
        reasoning:
          type: boolean
        inputPrice:
          type: number
          format: double
          nullable: true
          description: USD per million input tokens
        outputPrice:
          type: number
          format: double
          nullable: true
          description: USD per million output tokens
        enabled:
          type: boolean
        visibility:
          type: string
          enum: [all, teams]
          description: 'all: every team may use it; teams: the listed teams'
        personal:
          type: boolean
          description: Available in personal workspaces (when created, defaults to visibility = all)
        teams:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ModelTeam'
        providerTeam:
          allOf:
          - $ref: '#/components/schemas/ModelOwner'
          nullable: true
          x-omitempty: false
          description: The team that owns the model's provider (null for a platform provider); its models are that team's only
        revision:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ModelCreate:
      type: object
      required: [upstreamId]
      properties:
        upstreamId:
          type: string
          maxLength: 200
        name:
          type: string
          maxLength: 100
          description: Defaults to upstreamId
        contextWindow:
          type: integer
          format: int32
          description: Default 128000
        maxTokens:
          type: integer
          format: int32
          description: Default 16000
        images:
          type: boolean
        reasoning:
          type: boolean
        inputPrice:
          type: number
          format: double
        outputPrice:
          type: number
          format: double
        enabled:
          type: boolean
        visibility:
          type: string
          enum: [all, teams]
        personal:
          type: boolean
          description: Available in personal workspaces (when created, defaults to visibility = all)
        teams:
          type: array
          items:
            type: string
          description: Team slugs or IDs (visibility teams)
    ModelUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        contextWindow:
          type: integer
          format: int32
        maxTokens:
          type: integer
          format: int32
        images:
          type: boolean
        reasoning:
          type: boolean
        inputPrice:
          type: number
          format: double
          description: A negative value clears it
        outputPrice:
          type: number
          format: double
          description: A negative value clears it
        enabled:
          type: boolean
        visibility:
          type: string
          enum: [all, teams]
        personal:
          type: boolean
          description: Available in personal workspaces (when created, defaults to visibility = all)
        teams:
          type: array
          items:
            type: string
          description: Replaces the teams (visibility teams)
    AgentModel:
      type: object
      required: [id, name, providerName, source, available]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        providerName:
          type: string
        source:
          type: string
          enum: [agent, template]
          description: 'agent: chosen for this agent; template: its template version''s'
        available:
          type: boolean
          description: False when the model was disabled or unpublished; the agent does not start until moved to another
    AgentTemplate:
      type: object
      required: [id, slug, name, description, status, archived, currentVersion, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: assistant
        name:
          type: string
        description:
          type: string
        teamId:
          type: string
          format: uuid
          nullable: true
          description: The owning team; absent for platform templates
        teamSlug:
          type: string
          nullable: true
        teamName:
          type: string
          nullable: true
        status:
          type: string
          enum: [private, pending, published]
          description: 'private: the team only; pending: waiting for a platform admin; published: in the catalog'
        reviewNote:
          type: string
          nullable: true
          description: Why the last request to publish was rejected
        archived:
          type: boolean
        currentVersion:
          type: integer
          format: int32
        agentCount:
          type: integer
          format: int64
          nullable: true
          description: How many agents use it (one template's view only)
        revision:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AgentTemplateCreate:
      type: object
