  /v1/app/events:
    get:
      tags:
      - oauth
      operationId: getAppEvents
      summary: Server-sent events for the threads of everyone who connected the calling app (trusted apps, with their secret)
      description: >-
        Authenticated as the app itself: `Authorization: Bearer <app secret>` (pdpcs_…, issued by a platform admin to a
        trusted app; never a person's token). `event: ready` first, then `event: thread` (an AppThreadEvent) whenever a
        thread changes that one or more of the app's people may see, with their subjects (the thread names people only by
        subjects too: AppThread). The people are those with an
        active connection to the app (any scope; a connection whose refresh token expired or that was revoked counts no
        more, from the next change on) who are active (not suspended or denied by the group re-check), and each sees
        what their own GET /v1/agents/events through the app would show: agents of teams they are members of (no
        platform staff reads, never service-managed agents), shared threads and their own private ones, reserved
        threads only their own. `once=true` sends `ready` and ends. A keep-alive comment comes every 15 seconds. Every
        30 seconds the stream checks that its secret still exists and its app is still trusted, and ends otherwise
        (the reconnect is then 401). A slow reader misses events; reconnect and re-list after a gap.
      parameters:
      - name: once
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: The stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/ErrorReply'
        '429':
          $ref: '#/components/responses/ErrorReply'
  /v1/app/usage:
    get:
      tags:
      - oauth
      operationId: getAppUsage
      summary: Usage of the people who connected the calling app, by person and day (trusted apps, with their secret)
      description: >-
        Authenticated as the app itself (`Authorization: Bearer <app secret>`). Model requests and tokens (with a cost
        estimate at the models' current prices) and tool calls an agent made while answering a message sent through
        the app's tokens, by person (subject) and UTC day, ordered by day then subject, paged with cursor. Includes
        people who have since disconnected the app. Attribution is conservative: work of an agent that, at that moment,
        was answering people through different apps (or not through an app) is not counted for any app (DESIGN.md ›
        OAuth Connect).
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
        description: First day (UTC), default 6 days before `to`
      - name: to
        in: query
        schema:
          type: string
          format: date
        description: Last day (UTC, inclusive), default today; at most 92 days after from
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 200
      responses:
        '200':
          description: A page of usage
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AppUsagePage'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '429':
          $ref: '#/components/responses/ErrorReply'
