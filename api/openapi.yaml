        required: true
        description: The target team's slug or ID
        schema:
          type: string
      - name: modelId
        in: query
        required: false
        description: A model to switch to as part of the move (one the target team may use)
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AgentMovePlan'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
    post:
      tags:
      - agents
      operationId: moveAgent
      summary: Move the agent, with its conversations, to another team or workspace (owners and admins of both; platform admins between shared teams)
      description: >-
        A person (browser session, personal API key or an app they connected; never a service account) who is an
        owner or admin of both teams, or a platform admin between shared teams (not into a team they are a member
        of unless they may move it out of its team). A personal workspace on either side: its owner only. The agent
        keeps its schema, template version and conversations; its record now belongs to the target team, whose
        rules apply from then on. Its template and model must be available to the target team (409
        move_template_unavailable, move_model_unavailable; modelId switches the model), its name free there (409
        name_taken), and the team below its limits (409 too_many_agents, limit_reached). Service-managed agents
        don't move (409 agent_service_managed). Its external key, the MCP servers apps set on its threads, and the
        old team's MCP servers, service accounts and models stop applying; usage stays with the team it happened in.
        The runtime is stopped and starts with the new team's configuration on the next request. Audited in both
        teams' logs (agent.move).
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentMove'
      responses:
        '200':
          description: Moved
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '412':
          $ref: '#/components/responses/ErrorReply'
        '428':
          $ref: '#/components/responses/ErrorReply'
  /v1/agents/{agentId}/threads:
    parameters:
    - $ref: '#/components/parameters/AgentIdParam'
    get:
      tags:
      - agents
      operationId: listAgentThreads
      summary: The agent's conversations, most recently used first, with their status (does not wake the agent)
      description: >-
        From the platform's record of each thread, kept as messages are relayed and as the agent reports replies
        ending. A thread whose agent has not run since this record began appears after the agent's next start. Shared
        threads and the caller's own private ones; others' private threads are never listed.
        Paging is opt-in: without `limit` the reply is the whole list. With `limit` it is one page (newest activity
        first) and `nextCursor`, next to `data`, when more follow; pass it back as `cursor` with the same `q`. `q`
        filters by title (case-insensitive substring), with or without `limit`.
      parameters:
      - name: limit
        in: query
        required: false
        description: Page size (1-200). Without it, every thread.
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: cursor
        in: query
        required: false
        description: nextCursor from the previous page (opaque; a malformed one is 400 invalid_cursor)
        schema:
          type: string
          maxLength: 512
      - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: Threads
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentThread'
                  nextCursor:
                    type: string
                    description: Only with `limit`, when more threads follow
        '400':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '503':
          $ref: '#/components/responses/ErrorReply'
    post:
      tags:
      - agents
      operationId: createAgentThread
      summary: Start a conversation with a thread ID the platform chooses
      description: >-
        Records a new thread (the caller is its creator) under a random, unguessable ID and returns it; send the
        first message to `.../threads/{threadId}/messages`. Authorized like sending a message (anyone who may use the
        agent; 409 agent_disabled for a turned-off one). Both fields are optional: `visibility` (default shared) is
        fixed from now on, and `title` (default "New chat") is replaced by the first message's first line while it
        is still the default. A thread nobody sends to is removed after 30 days. Until its first message a thread is
        listed only for its creator. Clients may still choose thread IDs themselves (the first message or the
        thread's MCP servers start the thread under that ID), but only a platform-chosen ID is unguessable.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentThreadCreate'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: The thread's path
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AgentThread'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
  /v1/agents/{agentId}/threads/{threadId}:
    parameters:
    - $ref: '#/components/parameters/AgentIdParam'
    - $ref: '#/components/parameters/ThreadIdParam'
    patch:
      tags:
      - agents
      operationId: updateAgentThread
      summary: Rename a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentThreadUpdate'
      responses:
        '200':
          description: The thread
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AgentThread'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
    get:
      tags:
      - agents
      operationId: getAgentThread
      summary: A conversation's transcript and the reply in progress
      description: >-
        Without `limit` and `before`, the whole transcript. With either, one page of messages going backwards: the
        `limit` (default 50) messages before the one `before` names (the latest when absent), and `earlierCursor`
        when earlier messages exist (pass it as `before`). A page never starts with a tool result (it then also holds
        the reply that made the call). A cursor whose message has left the conversation's view (compacted or reset)
        gives an empty page. The reply in progress and the tools are always the current ones.
      parameters:
      - name: limit
        in: query
        required: false
        description: Messages per page (1-200, default 50 when `before` is given)
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: before
        in: query
        required: false
        description: earlierCursor from the previous page (opaque; a malformed one is 400 invalid_cursor)
        schema:
          type: string
          maxLength: 64
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ChatView'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '503':
          $ref: '#/components/responses/ErrorReply'
    delete:
      tags:
      - agents
      operationId: deleteAgentThread
      summary: Stop and remove a conversation from the agent's list
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Ok'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '503':
          $ref: '#/components/responses/ErrorReply'
  /v1/agents/{agentId}/threads/{threadId}/messages:
    parameters:
    - $ref: '#/components/parameters/AgentIdParam'
    - $ref: '#/components/parameters/ThreadIdParam'
    post:
      tags:
      - agents
      operationId: sendAgentMessage
      summary: Send a message (creates the thread on first use)
      description: >-
        Accepted, not answered; follow the thread's events for the reply. While the agent is busy the message runs
        after the current reply (`whenBusy: followUp`, the default) or steers it (`whenBusy: steer`). A repeated
        requestId is not submitted twice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentMessageCreate'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AgentMessageAccepted'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '503':
          $ref: '#/components/responses/ErrorReply'
  /v1/agents/{agentId}/threads/{threadId}/stop:
    parameters:
    - $ref: '#/components/parameters/AgentIdParam'
    - $ref: '#/components/parameters/ThreadIdParam'
    post:
      tags:
      - agents
      operationId: stopAgentThread
      summary: Stop the reply in progress
      responses:
        '202':
          description: Stopped
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Ok'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '503':
          $ref: '#/components/responses/ErrorReply'
  /v1/agents/{agentId}/threads/{threadId}/events:
    parameters:
    - $ref: '#/components/parameters/AgentIdParam'
    - $ref: '#/components/parameters/ThreadIdParam'
    get:
      tags:
      - agents
      operationId: streamAgentThread
      summary: Server-sent events with the conversation's view after every change
      description: |-
        Each `view` event's data is a ChatView (JSON), sent after every change (at most 10 a second). The stream keeps
        the agent awake while open. Access is checked again every 30 seconds: the stream ends when the caller is no
        longer active (suspended, or denied by the group re-check), may no longer use the agent, or the thread is
        another's private one.

        `format=delta` (version `v=1`, the only one) sends changes instead of whole views: a `snapshot` event first
        (a ChatView), then events for what changed, each a ChatDeltaEvent whose `type` is also the event's name and
        whose `seq` (also the event's `id`) counts up by one. Types: `message.added`, `message.updated` (replace the
        message with that id), `partial.set`, `partial.appended` (text and thinking to append to the reply in
        progress), `partial.cleared`, `tool.started`, `tool.updated` and `tool.finished` (status, `outputAppended` or
        `output`; null: none), `tool.removed`, `tools.set`, and `run` (`busy`). Tool events carry `startedAt` and
        `elapsedMs` (live metadata, not part of the view). Applying the events in order to the snapshot gives the
        view a new snapshot would; whatever can't be sent as a change (the conversation was compacted or reset) comes
        as a new snapshot. Every connection starts with a snapshot; with `Last-Event-ID` (EventSource sends it when it
        reconnects) its numbering goes on after that ID. A steering message is a `message.added` (a user message)
        after the tool results of the reply it steers, before that reply's next answer.

        `limit` keeps whole views and snapshots to the latest messages, with `earlierCursor` for the earlier ones
        (`GET` the thread with `before`); new messages are added to the window.
      parameters:
      - name: once
        in: query
        description: Send the current view (or snapshot) as one event, then end the stream
        schema:
          type: boolean
      - name: format
        in: query
        description: view (default) for whole views, delta for a snapshot and then changes
        schema:
          type: string
          enum: [view, delta]
      - name: v
        in: query
        description: The delta format's version (1); other values are 400 unsupported_version
        schema:
          type: integer
          enum: [1]
      - name: limit
        in: query
        description: Only the latest messages (1-200) in views and snapshots
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: Last-Event-ID
        in: header
        required: false
        description: The last delta event a reconnecting client applied; the new stream's numbering goes on after it
        schema:
          type: string
      responses:
        '200':
          description: An event stream
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '503':
          $ref: '#/components/responses/ErrorReply'
  /v1/oauth/consent:
    get:
      tags:
      - oauth
      operationId: getOAuthConsent
      summary: The consent page's view of an app's authorization request (the person signed in)
      description: >-
        The query is the authorization request the app sent to /oauth/authorize, unchanged (the platform redirects the
        browser to the web app's /connect/consent with it). A request that isn't valid is a 400 whose code starts with
        oauth_ (the page shows the reason and never sends the browser anywhere).
      parameters:
      - name: client_id
        in: query
        required: false
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: false
        schema:
          type: string
      - name: response_type
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge_method
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: scope
        in: query
        required: false
        schema:
          type: string
      - name: resource
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The app, where it will send the person back, and what it asks for
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/OAuthConsent'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
    post:
      tags:
      - oauth
      operationId: decideOAuthConsent
      summary: Allow or deny an app's authorization request; returns where to send the browser
      description: >-
        Allowing records the person's consent (a connected app, remembered until revoked) and returns the app's
        redirect URI with an authorization code; denying returns it with error=access_denied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthConsentDecision'
      responses:
        '200':
          description: Where to send the browser
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/OAuthConsentResult'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
  /v1/oauth/client-logo:
    get:
      tags:
      - oauth
      operationId: getOAuthClientLogo
      summary: An app's logo, served by the platform (the person signed in)
      description: >-
        The logo the app published (logo_uri; see OAuthClientInfo.logoUrl), fetched and checked by the platform and served
        from its own origin, since the console's Content-Security-Policy allows images only from the platform. The address
        is never taken from the request: only the logo of a client the platform knows (a registered client, a metadata
        document in its cache, or an app someone connected) is fetched, so this is not a proxy for other URLs. It is
        fetched from public addresses only over https without redirects, at most 256 KiB, and only PNG, JPEG, GIF or
        WebP whose bytes decode as that type (never SVG). The answer is cached by the platform and by the browser (private,
        one hour) and carries nosniff and a Content-Security-Policy that allows nothing. 404 logo_not_found: the client
        is unknown or published no logo; 404 logo_unavailable: it couldn't be loaded or isn't an acceptable image (the
        page shows the app's initials instead).
      parameters:
      - name: client_id
        in: query
        required: true
        description: The client_id of the app (an https URL or a pdpcl_ value), URL-encoded
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          description: The logo
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=3600
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '429':
          $ref: '#/components/responses/ErrorReply'
  /v1/me/oauth-grants:
    get:
      tags:
      - oauth
      operationId: listMyOAuthGrants
      summary: The apps the caller connected (newest first)
      responses:
        '200':
          description: Connected apps
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthGrant'
        '401':
          $ref: '#/components/responses/ErrorReply'
  /v1/me/oauth-grants/{grantId}:
    parameters:
    - $ref: '#/components/parameters/GrantIdParam'
    delete:
      tags:
      - oauth
      operationId: revokeMyOAuthGrant
      summary: Disconnect an app; its tokens stop working at once and its consent is forgotten
      responses:
        '200':
          $ref: '#/components/responses/OkReply'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/users/{userId}/oauth-grants:
    parameters:
    - $ref: '#/components/parameters/UserIdParam'
    get:
      tags:
      - oauth
      - admin
      operationId: adminListUserOAuthGrants
      summary: The apps a person connected (platform admins and auditors)
      responses:
        '200':
          description: Connected apps
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthGrant'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/users/{userId}/oauth-grants/{grantId}:
    parameters:
    - $ref: '#/components/parameters/UserIdParam'
    - $ref: '#/components/parameters/GrantIdParam'
    delete:
      tags:
      - oauth
      - admin
      operationId: adminRevokeUserOAuthGrant
      summary: Disconnect one of a person's apps (platform admins)
      responses:
        '200':
          $ref: '#/components/responses/OkReply'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/settings/oauth-clients:
    get:
      tags:
      - oauth
      - admin
      operationId: adminGetTrustedClients
      summary: Trusted apps, which skip the consent screen (platform admins and auditors)
      responses:
        '200':
          description: Trusted apps
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TrustedClients'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
    put:
      tags:
      - oauth
      - admin
      operationId: adminUpdateTrustedClients
      summary: Replace the trusted apps (platform admins)
      description: >-
        Only apps identified by a Client ID Metadata Document (an https URL with a path) can be trusted: a registered
        app's ID changes, and anyone can register any name. A trusted app skips the consent screen, never the sign-in.
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustedClientsUpdate'
      responses:
        '200':
          description: Trusted apps
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TrustedClients'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '412':
          $ref: '#/components/responses/ErrorReply'
        '422':
          $ref: '#/components/responses/ErrorReply'
        '428':
          $ref: '#/components/responses/ErrorReply'
components:
  headers:
    ETag:
      description: Quoted revision, for If-Match on the next update
      schema:
        type: string
    IdempotentReplayed:
      description: '"true" when the answer is an earlier request''s with the same Idempotency-Key'
      schema:
        type: string
        enum: ['true']
  parameters:
    McpServerIdParam:
      name: serverId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderIdParam:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelIdParam:
      name: modelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateIdParam:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentIdParam:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ThreadIdParam:
      name: threadId
      in: path
      required: true
      description: >-
        Thread ID (1-64 letters, digits, dashes or underscores): the platform's, from createAgentThread, or one the client
        chooses (use a random one: whoever uses an ID first starts that thread)
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'
    AuditActionParam:
      name: action
      in: query
      required: false
      description: An exact action (team.member_add), or a prefix ending in a dot (team.) for every action in that group.
      schema:
        type: string
        maxLength: 100
        pattern: ^[a-z][a-z_]*\.[a-z_]*$
        example: team.
    AuditActorKindParam:
      name: actorKind
      in: query
      required: false
      description: Only entries by the system
      schema:
        type: string
        enum:
        - system
    AuditActorParam:
      name: actorUserId
      in: query
      required: false
      description: Only entries by this person (including their API keys)
      schema:
        type: string
        format: uuid
    AuditExcludeActionParam:
      name: excludeAction
      in: query
      required: false
      description: 'Action groups (prefixes ending in a dot, comma-separated) to leave out: auth. hides sign-ins and sign-outs.'
      schema:
        type: string
        maxLength: 100
        pattern: ^[a-z][a-z_]*\.(,[a-z][a-z_]*\.)*$
        example: auth.
    AuditFromParam:
      name: from
      in: query
      required: false
      description: Entries at or after this time
      schema:
        type: string
        format: date-time
    AuditTargetTypeParam:
      name: targetType
      in: query
      required: false
      schema:
        type: string
        maxLength: 64
        pattern: ^[a-z_]+$
        example: team
    AuditToParam:
      name: to
      in: query
      required: false
      description: Entries before this time (exclusive)
      schema:
        type: string
        format: date-time
    CursorParam:
      name: cursor
      in: query
      required: false
      description: nextCursor from the previous page
      schema:
        type: string
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        A key the client chooses for one request (a UUID, for example), so a retry doesn't repeat it
        (draft-ietf-httpapi-idempotency-key-header). 1-255 printable ASCII characters, optionally quoted as a
        structured-field string. Invalid: 400 invalid_idempotency_key.
      schema:
        type: string
        maxLength: 257
    IfMatchHeader:
      name: If-Match
      in: header
      required: true
      description: The resource's revision, as returned in ETag (for example "3"). Missing returns 428; stale returns 412.
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    SearchParam:
      name: q
      in: query
      required: false
      description: Case-insensitive substring match
      schema:
        type: string
        maxLength: 200
    TeamParam:
      name: team
      in: path
      required: true
      description: Team slug or ID
      schema:
        type: string
    GrantIdParam:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceAccountIdParam:
      name: serviceAccountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    AuditPageReply:
      description: A page of audit entries, newest first
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/AuditPage'
    ErrorReply:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    HealthReply:
      description: Health status
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/Health'
    OkReply:
      description: Success
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/Ok'
  schemas:
    PersonalWorkspaceSettings:
      type: object
      required: [enabled, maxAgents, maxRunning, revision, updatedAt]
      properties:
        enabled:
          type: boolean
          description: People get a personal workspace when they sign in
        ownProviders:
          type: boolean
          x-omitempty: false
          description: Personal workspaces may add their own model providers (while teams may)
        ownMcpServers:
          type: boolean
          x-omitempty: false
          description: Personal workspaces may add their own MCP servers (while teams may)
        maxAgents:
          type: integer
          format: int32
        maxRunning:
          type: integer
          format: int32
          description: Agents running at once
        monthlyBudgetUsd:
          type: number
          format: double
          nullable: true
          description: Recorded; not enforced yet
        revision:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    PersonalWorkspaceSettingsUpdate:
      type: object
      required: [enabled, maxAgents, maxRunning]
      properties:
        enabled:
          type: boolean
        ownProviders:
          type: boolean
          description: Omitted keeps the current setting
        ownMcpServers:
          type: boolean
          description: Omitted keeps the current setting
        maxAgents:
          type: integer
          format: int32
        maxRunning:
          type: integer
          format: int32
        monthlyBudgetUsd:
          type: number
          format: double
          nullable: true
    WorkspaceLimits:
      type: object
      required: [kind, agentCount, runningCount, overridden]
      properties:
        kind:
          type: string
          enum: [team, personal]
        maxAgents:
          type: integer
          format: int32
          nullable: true
        maxRunning:
          type: integer
          format: int32
          nullable: true
        monthlyBudgetUsd:
          type: number
          format: double
          nullable: true
        overridden:
          type: array
          items:
            type: string
          description: Which limits are this workspace's own (the others are the platform's defaults)
        agentCount:
          type: integer
          format: int64
        runningCount:
          type: integer
          format: int64
        canAddProviders:
          type: boolean
          x-omitempty: false
          description: >-
            Whether the caller may add a model provider for this workspace now (an owner or admin in a browser
            session, while platform admins let teams, and personal workspaces, add them)
        canAddMcpServers:
          type: boolean
          x-omitempty: false
          description: >-
            Whether the caller may add an MCP server for this workspace now (an owner or admin in a browser session,
            while platform admins let teams, and personal workspaces, add them)
    WorkspaceLimitsUpdate:
      type: object
      properties:
        maxAgents:
          type: integer
          format: int32
          nullable: true
        maxRunning:
          type: integer
          format: int32
          nullable: true
        monthlyBudgetUsd:
          type: number
          format: double
          nullable: true
    McpTool:
      type: object
      required: [name]
      properties:
        name:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
    McpServer:
      type: object
      required: [id, name, slug, description, url, accessMode, enabled, visibility, personal, hasHeaders, tools, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          description: Names its tools for the model (mcp__<slug>__<tool>); unique across the platform and every team
        description:
          type: string
        url:
          type: string
        accessMode:
          type: string
          enum: [proxy, direct]
          description: 'proxy: agents call the platform, which adds the headers, allows only their tools and logs calls; direct: agents get the URL and headers'
        enabled:
          type: boolean
        visibility:
          type: string
          enum: [all, teams]
        personal:
          type: boolean
          description: Available in personal workspaces (when created, defaults to visibility = all)
        teams:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ModelTeam'
        hasHeaders:
          type: boolean
        tools:
          type: array
          items:
            $ref: '#/components/schemas/McpTool'
        toolsRefreshedAt:
          type: string
          format: date-time
          nullable: true
        toolsError:
          type: string
          nullable: true
          description: Why the tools could not be read the last time
        team:
          allOf:
          - $ref: '#/components/schemas/ModelOwner'
          nullable: true
          x-omitempty: false
          description: The team that owns the server (null for a platform server); a team's server is for that team only
        revision:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    McpServerCreate:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          pattern: '^[a-z0-9](?:[a-z0-9_]{0,30}[a-z0-9])?$'
          description: Default from the name; cannot change later
        description:
          type: string
          maxLength: 2000
        url:
          type: string
          maxLength: 2048
          description: The server's Streamable HTTP endpoint
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
        accessMode:
          type: string
          enum: [proxy, direct]
        visibility:
          type: string
          enum: [all, teams]
        personal:
          type: boolean
          description: Available in personal workspaces (when created, defaults to visibility = all)
        teams:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    McpServerUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        url:
          type: string
          maxLength: 2048
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
          description: Replaces every header ({} removes them)
        accessMode:
          type: string
          enum: [proxy, direct]
        visibility:
          type: string
          enum: [all, teams]
        personal:
          type: boolean
          description: Available in personal workspaces (when created, defaults to visibility = all)
        teams:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    McpAttach:
      type: object
      required: [serverId]
      properties:
        serverId:
          type: string
          format: uuid
        tools:
          type: array
          nullable: true
          items:
            type: string
          description: Only these of its tools (absent - all)
    McpAttached:
      type: object
      required: [serverId, name, slug]
      properties:
        serverId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        tools:
          type: array
          nullable: true
          items:
            type: string
    ClientMcpServer:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
          maxLength: 100
          description: Shown to the model; names the server's tools (mcpc__<slug>__<tool>)
        url:
          type: string
          maxLength: 2048
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
          description: For example the user's Authorization header
        expiresInSeconds:
          type: integer
          format: int32
          description: Default a day, at most a week
    ThreadMcpServer:
      type: object
      required: [name, slug, url, expiresAt]
      properties:
        name:
          type: string
        slug:
          type: string
        url:
          type: string
        expiresAt:
          type: string
          format: date-time
    UsageRow:
      type: object
      required: [requests, inputTokens, outputTokens, cacheReadTokens, cacheWriteTokens, costUsd, unpricedRequests, managed]
      properties:
        day:
          type: string
          format: date
          nullable: true
        modelId:
          type: string
          format: uuid
          nullable: true
          description: Absent when grouped by model - the platform's default model
        modelName:
          type: string
          nullable: true
        providerName:
          type: string
          nullable: true
        agentId:
          type: string
          format: uuid
          nullable: true
          description: Absent when grouped by agent (or agent and day) - a deleted agent, or service-managed agents summed
        agentName:
          type: string
          nullable: true
        managed:
          type: boolean
          description: Service-managed agents (one per app user)
        teamId:
          type: string
          format: uuid
          nullable: true
        teamSlug:
          type: string
          nullable: true
        teamName:
          type: string
          nullable: true
        requests:
          type: integer
          format: int64
        inputTokens:
          type: integer
          format: int64
        outputTokens:
          type: integer
          format: int64
        cacheReadTokens:
          type: integer
          format: int64
        cacheWriteTokens:
          type: integer
          format: int64
        costUsd:
          type: number
          format: double
          description: Estimated from the models' current prices
        unpricedRequests:
          type: integer
          format: int64
          description: Requests of models without prices (not in costUsd)
    UsageReport:
      type: object
      required: [from, to, groupBy, rows, total]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        groupBy:
          type: string
          enum: [day, model, agent, team, 'agent,day']
        rows:
          type: array
          items:
            $ref: '#/components/schemas/UsageRow'
        total:
          $ref: '#/components/schemas/UsageRow'
    ProviderType:
      type: object
      required: [id, name, api, authHeader]
      properties:
        id:
          type: string
          enum: [openai, anthropic, openai-compatible, openai-responses, anthropic-compatible]
        name:
          type: string
        api:
          type: string
          description: The API agents speak to it (openai-responses, anthropic-messages, openai-completions)
        defaultBaseUrl:
          type: string
          nullable: true
        authHeader:
          type: string
          enum: [authorization, x-api-key]
    ModelProvider:
      type: object
      required: [id, name, kind, baseUrl, accessMode, enabled, hasHeaders, modelCount, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [openai, anthropic, openai-compatible, openai-responses, anthropic-compatible]
        baseUrl:
          type: string
        accessMode:
          type: string
          enum: [proxy, direct]
          description: 'proxy: agents call the platform, which adds the key and counts usage; direct: agents get the URL and key'
        enabled:
          type: boolean
        hasHeaders:
          type: boolean
          description: Whether extra headers are set (their values are never returned)
        modelCount:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        team:
          allOf:
          - $ref: '#/components/schemas/ModelOwner'
          nullable: true
          x-omitempty: false
          description: The team that owns the provider (null for a platform provider)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ModelOwner:
      type: object
      required: [id, slug, name, kind]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [team, personal]
    ModelSettings:
      type: object
      required: [teamsMayAddProviders, privateNetworks, revision, updatedAt]
      properties:
        teamsMayAddProviders:
          type: boolean
          description: Team owners and admins may add model providers for their teams
        teamsMayAddMcpServers:
          type: boolean
          x-omitempty: false
          description: Team owners and admins may add MCP servers for their teams (always present)
        privateNetworks:
          type: array
          items:
            type: string
          description: >-
            Private CIDRs teams' own model providers and MCP servers may be on (public addresses are always allowed)
        revision:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    ModelSettingsUpdate:
      type: object
      required: [teamsMayAddProviders, privateNetworks]
      properties:
        teamsMayAddProviders:
          type: boolean
        teamsMayAddMcpServers:
          type: boolean
          description: Omitted keeps the current setting
        privateNetworks:
          type: array
          maxItems: 50
          items:
            type: string
          description: Private CIDRs such as 10.20.0.0/16 (not loopback, link-local or public ranges)
    ModelProviderCreate:
      type: object
      required: [name, kind, apiKey]
      properties:
        name:
          type: string
          maxLength: 100
        kind:
          type: string
          enum: [openai, anthropic, openai-compatible, openai-responses, anthropic-compatible]
        baseUrl:
          type: string
          maxLength: 2048
          description: 'Default for openai and anthropic; required otherwise (for example https://litellm.example.com/v1)'
        apiKey:
          type: string
          maxLength: 4096
          writeOnly: true
        accessMode:
          type: string
          enum: [proxy, direct]
          description: Default proxy (a team's providers are proxy only)
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
          description: Extra headers sent with every request (at most 20)
        enabled:
          type: boolean
    ModelProviderUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        baseUrl:
          type: string
          maxLength: 2048
        apiKey:
          type: string
          maxLength: 4096
          writeOnly: true
          description: Replaces the key
        accessMode:
          type: string
          enum: [proxy, direct]
        headers:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
          description: Replaces every extra header ({} removes them)
        enabled:
          type: boolean
    DiscoveredModel:
      type: object
      required: [id, name, added]
      properties:
        id:
          type: string
          description: The provider's model ID
        name:
          type: string
        contextWindow:
          type: integer
          format: int32
          nullable: true
        added:
          type: boolean
          description: Whether the catalog already has it
    ModelTeam:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    Model:
