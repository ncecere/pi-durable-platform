    parameters:
    - $ref: '#/components/parameters/AgentIdParam'
    - $ref: '#/components/parameters/ApprovalIdParam'
    get:
      tags:
      - agents
      operationId: getAgentApproval
      summary: One tool approval
      responses:
        '200':
          description: The approval
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ToolApproval'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
    post:
      tags:
      - agents
      operationId: decideAgentApproval
      summary: Approve or deny a pending tool call
      description: >-
        Records the decision (audited) and delivers it to the agent, waking it if it is hibernated: an approved call
        runs, a denied one isn't run and the model is told, with the reason. Who may decide: the thread's creator for a
        private thread; for a shared thread, the person (or service account) whose message started the run, the team's
        owners and admins, and members whose role is at least the version's approval role; for an unattended run, the
        team's owners and admins. Platform staff can't. 403 approval_forbidden for someone who may see but not decide;
        409 approval_decided once decided, timed out or cancelled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolApprovalDecision'
      responses:
        '200':
          description: The decided approval
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ToolApproval'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
