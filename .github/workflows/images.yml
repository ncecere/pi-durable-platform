# Images for every push: ghcr.io/ncecere/pi-durable-platform (the server)
# and ghcr.io/ncecere/pi-durable-platform-runtime (one agent per container),
# tagged sha-<first 12 characters of the commit>, and main also as main.
# linux/amd64 only (the homelab runs amd64). The cluster pins images by digest.
# Branches only: v* tags are built, checked, signed and published (vX.Y.Z,
# latest; multi-arch) by image.yml, and a run by hand on a tag does nothing
# here, so a release never gets a second sha-<12> image.
name: images

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.image }}
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pi-durable-platform
            context: .
            dockerfile: Dockerfile
          - image: pi-durable-platform-runtime
            context: runtime
            dockerfile: runtime/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the image
        id: name
        env:
          IMAGE: ${{ matrix.image }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE"
          tags="$image:sha-${sha:0:12}"
          if [ "$REF" = "main" ]; then tags="$tags,$image:main"; fi
          { echo "sha=$sha"; echo "image=$image"; echo "tags=$tags"; echo "version=sha-${sha:0:12}"; } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.tags }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.name.outputs.version }}
            COMMIT=${{ steps.name.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.name.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Summary
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "\`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
